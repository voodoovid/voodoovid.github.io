<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151a31">
<title>Follow Chestnut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout: a floating garden at dusk. Header on top; the board (a canvas) fills the middle; the command panel sits
   below it on tall screens and beside it on wide ones. Single dark theme by design: the sky is always dusk. */
:root {
  color-scheme: dark;
  --sky: #151a31;
  --panel: #20264a;
  --panel-hi: #2c3360;
  --ink: #f6f1e6;
  --dim: #a7acc9;
  --gold: #ffc861;
  --coral: #f2643f;
  --violet: #9a6bff;
  --wood: #b97c45;
  --mint: #7fd69a;
  --b: clamp(44px, calc(6vmin + 8px), 74px);   /* command button size */
  --font: "Fredoka", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky); color: var(--ink); font-family: var(--font);
  overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

#app { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto;
  padding: calc(var(--safe-top, env(safe-area-inset-top, 0px)) + 10px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.top { display: flex; align-items: center; gap: 12px; padding: 8px 12px; min-height: 52px; }
.lvl { display: flex; flex-direction: column; min-width: 0; flex: 1; line-height: 1.1; }
.lvl small { color: var(--gold); font-weight: 600; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
.lvl b { font-weight: 600; font-size: clamp(17px, 2.6vmin + 6px, 26px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats { display: flex; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; background: var(--panel);
  font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip svg { width: 18px; height: 18px; flex: none; }
.chip.met { background: #2d5a43; }
.chip.dimmed { opacity: .45; }
.pill { height: 38px; padding: 0 14px; border-radius: 19px; background: var(--panel); font-weight: 600; font-size: 15px; white-space: nowrap; }
.pill:active { background: var(--panel-hi); }

/* This game sits its whole layout 10px lower, clear of Safari's blurred top edge, so the shared Games button moves down with it */
#gamesPill.games-pill { top: calc(var(--safe-top, env(safe-area-inset-top, 0px)) + 18px); }
#stage { position: relative; min-width: 0; min-height: 0; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
#hint { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); max-width: min(560px, calc(100% - 24px));
  display: flex; gap: 10px; align-items: center; padding: 10px 16px 10px 10px; border-radius: 16px; background: rgba(32, 38, 74, .92);
  box-shadow: 0 6px 20px rgba(0,0,0,.35); font-size: clamp(14px, 1.6vmin + 8px, 19px); line-height: 1.3; pointer-events: none;
  transition: opacity .3s; }
#hint canvas { width: 40px; height: 40px; flex: none; }
#hint.gone { opacity: 0; }

#panel { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 6px 12px 10px; }
.dpad { display: grid; grid-template-columns: repeat(3, var(--b)); grid-template-rows: repeat(3, var(--b)); gap: 4px; flex: none; }
.dpad .count { grid-area: 2 / 2; display: grid; place-items: center; font-weight: 700; font-size: calc(var(--b) * .32); color: var(--dim); }
.cmd { position: relative; width: var(--b); height: var(--b); border-radius: calc(var(--b) * .26); background: var(--panel);
  display: grid; place-items: center; box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); transition: transform .08s, background .15s; }
.cmd svg { width: 58%; height: 58%; }
.cmd:active { transform: scale(.94); }
.cmd.on { background: #fff4dc; color: #2a2238; box-shadow: 0 0 0 3px var(--gold), inset 0 -3px 0 rgba(0,0,0,.12); }
.cmd:disabled { opacity: .35; cursor: default; }
.cmd .n { position: absolute; right: -5px; top: -5px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--coral);
  color: #fff; font-size: 13px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
.cmd .n.zero { background: #555b7d; }
.dpad .cmd { color: var(--coral); }
.dpad .cmd.on { color: var(--coral); }
#tJ { color: var(--violet); } #tP { color: var(--wood); } #tX { color: var(--dim); }
.tools { display: flex; flex-direction: column; gap: 6px; }
.run { display: grid; grid-template-columns: repeat(2, auto); gap: 6px; }
.act { height: calc(var(--b) * .82); min-width: calc(var(--b) * 1.45); padding: 0 12px; border-radius: calc(var(--b) * .24); background: var(--panel);
  font-weight: 600; font-size: clamp(14px, calc(var(--b) * .26), 19px); display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
.act svg { width: 1.1em; height: 1.1em; }
.act:active { transform: scale(.96); }
.act.go { background: var(--mint); color: #12301f; }
.act.go.pause { background: var(--gold); color: #3a2a06; }
.act.on { background: #fff4dc; color: #2a2238; }

/* Wide screens: the panel moves to the right of the board */
@media (orientation: landscape) and (min-width: 700px) {
  #app { grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr); }
  .top { grid-column: 1 / -1; }
  #panel { flex-direction: column; justify-content: center; padding: 6px 16px 16px 4px; gap: 18px; }
  .tools { flex-direction: row; }
  .run { grid-template-columns: repeat(2, 1fr); }
}
/* Short landscape phones: smaller buttons so the panel fits */
@media (orientation: landscape) and (max-height: 500px) {
  :root { --b: 40px; }
  #panel { gap: 8px; padding: 4px 10px 6px 4px; }
  .top { min-height: 44px; padding: 4px 10px; }
}

/* Overlays: the menu and the end-of-run card */
.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px;
  padding-top: max(16px, var(--safe-top, env(safe-area-inset-top, 0px))); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  background: rgba(12, 14, 30, .72); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); overflow-y: auto; }
.card { width: min(100%, 760px); background: linear-gradient(180deg, #262d58, #1c2246); border-radius: 26px; padding: 22px clamp(16px, 4vw, 34px) 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08); text-align: center; }
.brand { display: flex; align-items: center; justify-content: center; gap: 14px; }
#menuCat { width: clamp(90px, 16vmin, 150px); height: clamp(90px, 16vmin, 150px); cursor: pointer; }
h1 { margin: 0; font-weight: 700; font-size: clamp(32px, 6vmin + 6px, 60px); line-height: 1; text-align: left; }
h1 span { color: var(--gold); display: block; }
.tag { margin: 8px 0 0; color: var(--dim); font-size: clamp(15px, 1.4vmin + 9px, 20px); text-align: left; }
.levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0 6px; }
.lv { position: relative; padding: 10px 6px 8px; border-radius: 16px; background: var(--panel-hi); display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
.lv b { font-size: 24px; line-height: 1; }
.lv .nm { font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.lv .st { font-size: 15px; letter-spacing: 1px; color: var(--gold); }
.lv .st i { font-style: normal; color: #4b5280; }
.lv.cur { box-shadow: 0 0 0 3px var(--gold); }
.lv:disabled { opacity: .4; cursor: default; }
.menu-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; color: var(--dim); font-size: 13px; }
.menu-foot .pill { font-size: 14px; height: 34px; }
.big { height: 54px; padding: 0 28px; border-radius: 27px; background: var(--gold); color: #3a2a06; font-weight: 700; font-size: 21px; }
.big.alt { background: var(--panel-hi); color: var(--ink); }
.result { width: min(100%, 440px); }
.result h2 { margin: 6px 0 4px; font-size: 32px; font-weight: 700; }
.result p { margin: 6px 0; color: var(--dim); font-size: 18px; }
.stars { display: flex; justify-content: center; gap: 10px; margin: 8px 0 4px; }
.stars svg { width: 56px; height: 56px; }
.stars svg.got { animation: pop .45s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes pop { from { transform: scale(0) rotate(-30deg); } to { transform: scale(1) rotate(0); } }
.goals { list-style: none; padding: 0; margin: 10px auto 16px; text-align: left; display: inline-flex; flex-direction: column; gap: 4px; font-size: 17px; }
.goals li::before { content: "○ "; color: var(--dim); }
.goals li.ok::before { content: "● "; color: var(--gold); }
.btns { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
#version { position: fixed; right: calc(env(safe-area-inset-right, 0px) + 8px); bottom: calc(env(safe-area-inset-bottom, 0px) + 4px);
  font: 11px system-ui, sans-serif; color: rgba(167,172,201,.55); pointer-events: none; z-index: 60; }
/* Narrow phones: the counters get their own row under the title */
@media (max-width: 620px) {
  .top { flex-wrap: wrap; row-gap: 6px; padding-bottom: 4px; }
  .stats { order: 3; flex-basis: 100%; justify-content: center; }
  .pill .long { display: none; }
  .pill { padding: 0 12px; }
}
@media (min-width: 621px) { .pill .short { display: none; } }
@media (orientation: landscape) and (max-height: 500px) {
  #hint { font-size: 14px; padding: 6px 12px 6px 6px; bottom: 6px; }
  #hint canvas { width: 30px; height: 30px; }
}
@media (max-width: 520px) {
  .levels { grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .lv .nm { display: none; }
  .brand { gap: 8px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<!-- Shared "back to the games menu" button: identical in every game on the site -->
<a class="games-pill" id="gamesPill" href="../" hidden aria-label="Back to the games menu">&lsaquo; Games</a>
<style>
.games-pill { position: fixed; z-index: 9999; top: calc(var(--safe-top, env(safe-area-inset-top, 0px)) + 10px); left: calc(env(safe-area-inset-left, 0px) + 8px);
  display: inline-flex; align-items: center; gap: 3px; height: 34px; padding: 0 14px 0 11px; box-sizing: border-box; border-radius: 17px;
  background: #ffd166; color: #241a05; border: 2px solid #fff3c4; box-shadow: 0 2px 10px rgba(0,0,0,.5);
  font: 700 15px/1 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .01em; text-decoration: none; -webkit-tap-highlight-color: transparent; }
.games-pill:active { transform: scale(.95); }
.games-pill:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.games-pill[hidden] { display: none !important; }
</style>
<script>
(() => {
  const pill = document.getElementById("gamesPill");
  // Where the status bar ends. The installed app sometimes reports 0 here (after the device turns), which put this button
  // and the titles under the blurred status bar. So in the app use at least the status bar's height, plus a little air.
  const safeTop = () => {
    const d = document.documentElement, p = document.createElement("div");
    p.style.cssText = "position:fixed;top:0;left:0;width:0;visibility:hidden;height:env(safe-area-inset-top,0px)";
    d.appendChild(p); let t = p.offsetHeight; p.remove();
    if (navigator.standalone || matchMedia("(display-mode: standalone)").matches)
      t = Math.max(t, Math.min(screen.width, screen.height) >= 700 ? 24 : innerHeight > innerWidth ? 54 : 0) + 8;
    d.style.setProperty("--safe-top", t + "px");
  };
  safeTop(); addEventListener("resize", safeTop); addEventListener("orientationchange", () => setTimeout(safeTop, 250));
  // Only on the games site, not when a page is opened on its own
  if (!/\/(hangman|scareisdale|ponchos-adventure|flip-five|flip-five-3d|follow-chestnut)\//.test(location.pathname)) return;
  pill.hidden = false;
  // Lock the screen: no rubber-band bounce or drag when swiping, except inside something that really scrolls
  document.documentElement.style.overscrollBehavior = "none"; document.body.style.overscrollBehavior = "none";
  const canScroll = el => {
    for (; el && el !== document.documentElement; el = el.parentElement) {
      if (el.closest && el.closest("input, textarea, select")) return true;
      const s = getComputedStyle(el);
      if (/(auto|scroll)/.test(s.overflowY + s.overflowX) && (el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1)) return true;
    }
    const d = document.documentElement;
    return d.scrollHeight > innerHeight + 1 || d.scrollWidth > innerWidth + 1;
  };
  document.addEventListener("touchmove", e => { if (e.touches.length === 1 && e.cancelable && !canScroll(e.target)) e.preventDefault(); }, { passive: false });
  // Nudge the game's top row right so nothing sits under the button
  const fit = () => {
    for (const el of document.querySelectorAll("[data-pill-gap]")) {
      el.style.paddingLeft = "";
      const p = pill.getBoundingClientRect(), r = el.getBoundingClientRect();
      if (r.height && r.top < p.bottom + 4 && r.bottom > p.top) {
        const need = Math.ceil(p.right + 10 - r.left);
        if (need > 0) { el.style.boxSizing = "border-box"; el.style.paddingLeft = need + "px"; }
      }
    }
  };
  addEventListener("DOMContentLoaded", fit); addEventListener("load", fit); addEventListener("resize", fit);
  addEventListener("orientationchange", () => setTimeout(fit, 250));
  if (document.fonts) document.fonts.ready.then(fit);
})();
</script>

<div id="app">
  <header class="top" data-pill-gap>
    <div class="lvl"><small id="lvlNum">Level 1</small><b id="lvlName">First Steps</b></div>
    <div class="stats">
      <span class="chip" id="chipHome" title="Walkers home / needed">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="5" r="3.2" fill="currentColor"/><path d="M5 18c0-5 2-8 5-8s5 3 5 8z" fill="currentColor"/></svg>
        <span id="home">0 / 6</span></span>
      <span class="chip dimmed" id="chipFish" title="Fish">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 10c3-4 8-5 12-1l4-3v8l-4-3c-4 4-9 3-12-1z" fill="#ff9a5c"/><circle cx="6" cy="9.3" r="1" fill="#2a2238"/></svg>
        <span id="fish">0 / 1</span></span>
    </div>
    <button class="pill" id="btnSound" aria-label="Sound"><span class="long">Sound on</span><span class="short">♪ On</span></button>
    <button class="pill" id="btnLevels">Levels</button>
  </header>

  <main id="stage">
    <canvas id="cv" aria-label="Game board"></canvas>
    <div id="hint"><canvas id="hintCat" width="80" height="80" aria-hidden="true"></canvas><span id="hintText"></span></div>
  </main>

  <nav id="panel" aria-label="Commands">
    <div class="dpad" id="dpad">
      <button class="cmd" data-cmd="U" style="grid-area:1/2" aria-label="Turn up"><svg viewBox="0 0 24 24"><path d="M12 3l8 9h-5v9H9v-9H4z" fill="currentColor"/></svg></button>
      <button class="cmd" data-cmd="L" style="grid-area:2/1" aria-label="Turn left"><svg viewBox="0 0 24 24"><path d="M3 12l9-8v5h9v6h-9v5z" fill="currentColor"/></svg></button>
      <div class="count" id="turnCount">×2</div>
      <button class="cmd" data-cmd="R" style="grid-area:2/3" aria-label="Turn right"><svg viewBox="0 0 24 24"><path d="M21 12l-9 8v-5H3V9h9V4z" fill="currentColor"/></svg></button>
      <button class="cmd" data-cmd="D" style="grid-area:3/2" aria-label="Turn down"><svg viewBox="0 0 24 24"><path d="M12 21l-8-9h5V3h6v9h5z" fill="currentColor"/></svg></button>
    </div>
    <div class="tools">
      <button class="cmd" id="tJ" data-cmd="J" aria-label="Jump"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19c2-9 7-12 11-12 3 0 5 2 6 4"/><path d="M20 5v6h-6"/><path d="M3 21h6M15 21h6"/></svg><span class="n" id="nJ">1</span></button>
      <button class="cmd" id="tP" data-cmd="P" aria-label="Plank"><svg viewBox="0 0 24 24"><rect x="2" y="8" width="20" height="8" rx="1.5" fill="currentColor"/><path d="M8 8v8M14 8v8" stroke="#2a1f12" stroke-width="1.4" opacity=".55"/></svg><span class="n" id="nP">1</span></button>
      <button class="cmd" id="tX" data-cmd="X" aria-label="Remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="run">
      <button class="act go" id="btnGo"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg><span>Go</span></button>
      <button class="act" id="btnFast" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 5l9 7-9 7zM12 5l9 7-9 7z" fill="currentColor"/></svg><span>Fast</span></button>
      <button class="act" id="btnReset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg><span>Restart</span></button>
      <button class="act" id="btnClear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg><span>Clear</span></button>
    </div>
  </nav>
</div>

<!-- Title screen and level picker -->
<div class="overlay" id="menu">
  <div class="card">
    <div class="brand">
      <canvas id="menuCat" width="300" height="300" aria-label="Chestnut, an all-grey cat"></canvas>
      <div><h1>Follow <span>Chestnut</span></h1>
        <p class="tag">Chestnut the grey cat guides a marching crowd home. Place arrows, jumps and planks so they reach the light.</p></div>
    </div>
    <div class="levels" id="levels"></div>
    <div class="btns" style="margin-top:12px"><button class="big" id="btnPlay">Play</button></div>
    <div class="menu-foot"><span id="menuStars"></span><button class="pill" id="btnResetProgress">Reset progress</button></div>
  </div>
</div>

<!-- End of a run -->
<div class="overlay" id="result" hidden>
  <div class="card result">
    <div class="stars" id="resStars"></div>
    <h2 id="resTitle">Everyone's home!</h2>
    <p id="resText"></p>
    <ul class="goals" id="resGoals"></ul>
    <div class="btns" id="resBtns"></div>
  </div>
</div>
<div id="version"></div>

<script>
(() => {
"use strict";
// ===== Engine: the crowd simulation. Pure logic, no drawing, so levels can be tested on their own. =====
const DIR = { U: [0, -1], R: [1, 0], D: [0, 1], L: [-1, 0] };
const CW = { U: "R", R: "D", D: "L", L: "U" }, CCW = { U: "L", L: "D", D: "R", R: "U" }, BACK = { U: "D", D: "U", L: "R", R: "L" };
const FIXED_CHARS = { "^": "U", ">": "R", "v": "D", "<": "L" };
const CRACK_LIMIT = 4;   // a cracked tile crumbles once this many walkers have crossed it

// Map key: '#' wall, ' ' hole, '.' floor, 'S' door (start), 'E' exit, 'f' fish, 'x' cracked floor,
// 'b'/'c' paw plates that open gates 'G'/'H', '^ > v <' painted arrows the player can't move.
function makeWorld(level, cmds) {
  const rows = level.map, h = rows.length, w = Math.max(...rows.map(r => r.length));
  const tiles = [], fixed = {};
  let start = null, fishTotal = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let ch = rows[y][x] || " ";
    if (FIXED_CHARS[ch]) { fixed[y * w + x] = FIXED_CHARS[ch]; ch = "."; }
    if (ch === "S") start = { x, y };
    if (ch === "f") fishTotal++;
    tiles.push(ch);
  }
  return {
    w, h, tiles, fixed, start, dir: level.dir, total: level.total, need: level.need, gap: level.gap || 2,
    cmds: new Map(cmds || []), fishTotal, fishGot: 0, open: { G: false, H: false }, cracks: {},
    walkers: [], spawned: 0, saved: 0, lost: 0, tick: 0, ver: 0, over: false, won: false, nextId: 1, events: [],
    limit: level.total * (level.gap || 2) + w * h * 3 + 60,
  };
}
const inside = (W, x, y) => x >= 0 && y >= 0 && x < W.w && y < W.h;
const tileAt = (W, x, y) => inside(W, x, y) ? W.tiles[y * W.w + x] : " ";
function isBlock(W, x, y) {
  const t = tileAt(W, x, y);
  return t === "#" || (t === "G" && !W.open.G) || (t === "H" && !W.open.H);
}
function isGround(W, x, y) {
  if (!inside(W, x, y)) return false;
  const i = y * W.w + x, t = W.tiles[i];
  if (t === " ") return W.cmds.get(i) === "P";
  return t !== "#";
}
// What may go where: planks only over holes; arrows and jumps on open floor that isn't the exit or a painted arrow.
function canPlace(W, x, y, cmd) {
  if (!inside(W, x, y)) return false;
  const i = y * W.w + x, t = W.tiles[i];

  c.fillStyle = "rgba(0,0,0,.22)"; c.beginPath(); c.ellipse(0, 0, s * .26, s * .07, 0, 0, 7); c.fill();
  c.translate(0, -hop); c.scale(face, 1);

  const body = "#8b8e96", shade = "#6f727b", line = "#5c5f68";

  c.strokeStyle = body; c.lineWidth = s * .1; c.lineCap = "round";
  c.beginPath(); c.moveTo(s * .13, -s * .08); c.bezierCurveTo(s * .44, -s * .02, s * .4, -s * .45, s * (.34 + sw * .22), -s * .6); c.stroke();
  // body
  c.fillStyle = body; c.beginPath(); c.ellipse(0, -s * .27, s * .17, s * .29, 0, 0, 7); c.fill();   // slim body
  // front paws, outlined so they read against the body
  c.fillStyle = body; c.strokeStyle = shade; c.lineWidth = s * .02;
  c.beginPath(); c.ellipse(-s * .065, -s * .02, s * .055, s * .045, 0, 0, 7); c.fill(); c.stroke();
  c.beginPath(); c.ellipse(s * .065, -s * .02, s * .055, s * .045, 0, 0, 7); c.fill(); c.stroke();
  // head
  const hy = -s * .66;

  c.beginPath(); c.moveTo(-s * .2, hy - s * .07); c.lineTo(-s * .18, hy - s * .35); c.lineTo(-s * .03, hy - s * .18); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(s * .2, hy - s * .07); c.lineTo(s * .18, hy - s * .35); c.lineTo(s * .03, hy - s * .18); c.closePath(); c.fill();
  c.fillStyle = shade;   // inner ears: a darker grey, not pink
  c.beginPath(); c.moveTo(-s * .165, hy - s * .11); c.lineTo(-s * .165, hy - s * .27); c.lineTo(-s * .075, hy - s * .17); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(s * .165, hy - s * .11); c.lineTo(s * .165, hy - s * .27); c.lineTo(s * .075, hy - s * .17); c.closePath(); c.fill();
  c.fillStyle = body; c.beginPath(); c.ellipse(0, hy, s * .21, s * .2, 0, 0, 7); c.fill();

  c.beginPath(); c.moveTo(0, hy + s * .075); c.quadraticCurveTo(-s * .02, hy + s * .11, -s * .05, hy + s * .1);
  c.moveTo(0, hy + s * .075); c.quadraticCurveTo(s * .02, hy + s * .11, s * .05, hy + s * .1); c.stroke();

    for (const ex of [-.085, .085]) {

      c.strokeStyle = "#7f8a1e"; c.lineWidth = s * .01; c.stroke();
      c.fillStyle = "#1d1d22"; c.beginPath(); c.ellipse(s * ex + s * .008, hy - s * .02, s * .016, s * .045, 0, 0, 7); c.fill();
      c.fillStyle = "#fff"; c.beginPath(); c.arc(s * ex + s * .02, hy - s * .045, s * .012, 0, 7); c.fill();

}
function drawMenuCat() {
  const m = $("menuCat"), c = m.getContext("2d");
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, m.width, m.height);
  const g = c.createRadialGradient(150, 170, 10, 150, 170, 150);
  g.addColorStop(0, "rgba(255,200,97,.35)"); g.addColorStop(1, "rgba(255,200,97,0)");
  c.fillStyle = g; c.fillRect(0, 0, 300, 300);
  drawCat(c, 150, 272, 280, G.time, G.cat.happy ? { ...G.cat, tx: 0, ty: 0, x: 0, y: 0, face: 1 } : null);
}
function drawHintCat() {
  const m = $("hintCat"), c = m.getContext("2d");
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, 80, 80);
  drawCat(c, 40, 76, 74, G.time, null);
}

// ---------- Main loop ----------
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  G.time += dt;
  if (G.W && G.mode === "run") {
    const interval = G.fast ? 0.11 : 0.3;
    G.acc += dt;
    while (G.acc >= interval && G.mode === "run") { G.acc -= interval; tick(); }
    G.alpha = Math.min(1, G.acc / interval);
  } else if (G.W && G.mode === "done") {
    G.acc += dt; G.alpha = Math.min(3, G.alpha + dt / 0.3);   // let the last walkers finish their animation
  }
  // Chestnut trots to wherever a command was placed
  const cat = G.cat, dx = cat.tx - cat.x, dy = cat.ty - cat.y, d = Math.hypot(dx, dy);
  if (d > .01) { const sp = Math.min(d, dt * 9); cat.x += dx / d * sp; cat.y += dy / d * sp; } else { cat.x = cat.tx; cat.y = cat.ty; }
  draw();
  if (!$("menu").hidden) drawMenuCat();
  if (!$("hint").classList.contains("gone")) drawHintCat();
  requestAnimationFrame(frame);
}

// ---------- Sound: small synthesized effects and a music-box loop ----------
const Sound = (() => {
  let ac = null, master = null, sfx = null, mus = null, keepAlive = null, musicTimer = null, nextBar = 0, bar = 0, lastSaved = 0;
  let mode = store.get("sound", "all");      // all | sfx | off
  function iosUnlock() {
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
    if (!keepAlive) {
      // older iOS: a looping silent <audio> track puts the page in the playback category so the Silent switch doesn't mute it
      const rate = 8000, n = rate / 2, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
      const w = (o, str) => [...str].forEach((ch, i) => v.setUint8(o + i, ch.charCodeAt(0)));
      w(0, "RIFF"); v.setUint32(4, 36 + n, true); w(8, "WAVEfmt "); v.setUint32(16, 16, true);
      v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate, true);
      v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, "data"); v.setUint32(40, n, true);
      for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
      keepAlive = new Audio(URL.createObjectURL(new Blob([buf], { type: "audio/wav" })));
      keepAlive.loop = true; keepAlive.setAttribute("playsinline", "");
    }
    keepAlive.play().catch(() => {});
    const b = ac.createBufferSource(); b.buffer = ac.createBuffer(1, 1, 22050); b.connect(ac.destination); b.start(0);
  }
  function unlock() {
    if (mode === "off") return;
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
      const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3; comp.connect(ac.destination);
      master = ac.createGain(); master.gain.value = .9; master.connect(comp);
      sfx = ac.createGain(); sfx.gain.value = .8; sfx.connect(master);
      mus = ac.createGain(); mus.gain.value = 0; mus.connect(master);
      iosUnlock();
    }
    if (ac.state !== "running") ac.resume().catch(() => {});
    applyMode();
  }
  function applyMode() {
    $("btnSound").querySelector(".long").textContent = mode === "all" ? "Sound on" : mode === "sfx" ? "Music off" : "Muted";
    $("btnSound").querySelector(".short").textContent = mode === "all" ? "♪ On" : mode === "sfx" ? "♪ Fx" : "♪ Off";
    $("btnSound").setAttribute("aria-label", "Sound: " + (mode === "all" ? "music and effects" : mode === "sfx" ? "effects only" : "off"));
    if (!ac) return;
    const now = ac.currentTime;
    mus.gain.cancelScheduledValues(now); mus.gain.setTargetAtTime(mode === "all" ? .32 : 0, now, .3);
    sfx.gain.setTargetAtTime(mode === "off" ? 0 : .8, now, .05);
    if (mode === "all" && !musicTimer) { nextBar = ac.currentTime + .2; musicTimer = setInterval(schedule, 200); schedule(); }
    if (mode !== "all" && musicTimer) { clearInterval(musicTimer); musicTimer = null; }
    if (mode === "off" && keepAlive) keepAlive.pause();
    else if (keepAlive && keepAlive.paused) keepAlive.play().catch(() => {});
  }
  function cycle() { mode = mode === "all" ? "sfx" : mode === "sfx" ? "off" : "all"; store.set("sound", mode); if (mode !== "off") unlock(); applyMode(); }
  const ok = () => ac && mode !== "off" && ac.state === "running";
  function tone(freq, dur, { type = "sine", vol = .3, at = 0, to = null, attack = .005, dest = null } = {}) {
    const t0 = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);

    o.connect(g); g.connect(dest || sfx); o.start(t0); o.stop(t0 + dur + .02);
  }
  function noise(dur, { vol = .2, freq = 800, at = 0 } = {}) {
    const t0 = ac.currentTime + at, len = Math.ceil(ac.sampleRate * dur), b = ac.createBuffer(1, len, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = b; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(sfx); src.start(t0);
  }
  const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
  // music box: a gentle 8-bar loop in C major pentatonic
  const MEL = [[0, 4], [2, 3], [4, 2], [6, 3], [8, 4], [10, 5], [12, 4], [14, 2], [16, 3], [18, 1], [20, 2], [22, 0], [24, 1], [26, 2], [28, 0],
               [32, 4], [34, 3], [36, 4], [38, 5], [40, 4], [42, 2], [44, 3], [48, 2], [50, 1], [52, 0], [54, 1], [56, 2], [58, 1], [60, 0]];
  const BASS = [130.81, 110, 87.31, 98, 130.81, 110, 87.31, 98];
  function schedule() {
    if (!ac || mode !== "all") return;
    const beat = 60 / 84 / 2;     // eighth notes at 84 bpm
    while (nextBar < ac.currentTime + 1.2) {
      const b = bar % 8, t0 = nextBar - ac.currentTime;
      for (const [st, n] of MEL) if ((st >> 3) === b) bell(PENTA[n], t0 + (st & 7) * beat, .14);
      tone(BASS[b], beat * 7.5, { type: "triangle", vol: .12, at: t0, attack: .03, dest: mus });
      tone(BASS[b] * 1.5, beat * 7.5, { type: "sine", vol: .05, at: t0 + beat * 2, attack: .05, dest: mus });
      nextBar += beat * 8; bar++;

  }
  function bell(f, at, vol) {
    tone(f, 1.2, { type: "sine", vol, at, dest: mus });

  }
  return {
    unlock, cycle, applyMode,
    tick() { if (ok()) tone(900, .05, { vol: .08 }); },
    place(t) { if (!ok()) return; t === "P" ? (noise(.08, { vol: .25, freq: 600 }), tone(220, .1, { type: "triangle", vol: .2 })) : tone(620, .12, { vol: .22, to: 940 }); },
    remove() { if (ok()) tone(700, .12, { vol: .18, to: 380 }); },
    no() { if (ok()) { tone(170, .14, { type: "square", vol: .08 }); tone(150, .14, { type: "square", vol: .06, at: .09 }); } },
    saved() {
      if (!ok() || ac.currentTime - lastSaved < .07) return; lastSaved = ac.currentTime;
      const f = PENTA[(Math.random() * PENTA.length) | 0] * 2;
      tone(f, .35, { type: "triangle", vol: .12 }); tone(f * 1.5, .25, { vol: .05, at: .03 });
    },
    fall() { if (ok()) tone(760, .5, { vol: .1, to: 160 }); },
    jump() { if (ok()) tone(300, .16, { vol: .14, to: 680 }); },
    fish() { if (!ok()) return; tone(1318, .15, { type: "triangle", vol: .16 }); tone(1760, .25, { type: "triangle", vol: .14, at: .08 }); },
    gate() { if (!ok()) return; noise(.15, { vol: .3, freq: 400 }); tone(523, .3, { type: "triangle", vol: .14, at: .08 }); tone(784, .4, { type: "triangle", vol: .14, at: .18 }); },
    crumble() { if (!ok()) return; noise(.45, { vol: .35, freq: 500 }); tone(120, .3, { type: "triangle", vol: .2, to: 60 }); },
    win() { if (!ok()) return; [523, 659, 784, 1046].forEach((f, i) => tone(f, .5, { type: "triangle", vol: .16, at: i * .11 })); },
    lose() { if (!ok()) return; tone(392, .35, { type: "triangle", vol: .15 }); tone(311, .5, { type: "triangle", vol: .15, at: .25 }); },

      if (!ok()) return;
      // a little sawtooth "mew" shaped by a vowel-like band-pass filter
      const t0 = ac.currentTime, o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
      o.type = "sawtooth"; o.frequency.setValueAtTime(560, t0); o.frequency.linearRampToValueAtTime(820, t0 + .14); o.frequency.exponentialRampToValueAtTime(470, t0 + .5);
      f.type = "bandpass"; f.Q.value = 3; f.frequency.setValueAtTime(900, t0); f.frequency.linearRampToValueAtTime(1700, t0 + .15); f.frequency.linearRampToValueAtTime(1000, t0 + .5);
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.35, t0 + .05); g.gain.setValueAtTime(.35, t0 + .3); g.gain.exponentialRampToValueAtTime(.001, t0 + .55);
      o.connect(f); f.connect(g); g.connect(sfx); o.start(t0); o.stop(t0 + .6);
    },
  };
})();
$("btnSound").onclick = () => Sound.cycle();
Sound.applyMode();

// Pick up a newer version: whenever the game opens or comes back on screen, ask the site for the latest page and
// reload if its version is different. Placed commands and stars are saved on the device, so nothing is lost.
async function checkForUpdate() {
  if (!location.pathname.includes("/follow-chestnut/") || !navigator.onLine) return;
  try {
    const res = await fetch(location.pathname, { cache: "no-cache" });
    const m = res.ok && (await res.text()).match(/const VERSION = "([^"]+)"/);
    if (!m || m[1] === VERSION || sessionStorage.getItem(KEY + "tried") === m[1]) return;
    sessionStorage.setItem(KEY + "tried", m[1]);
    setTimeout(() => location.reload(), G.mode === "run" ? 1500 : 0);
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkForUpdate(); else if (G.mode === "run") { G.mode = "pause"; updateUI(); } });
setTimeout(checkForUpdate, 1500);

// Start: the level picker, with the last level loaded behind it
loadLevel(Math.min(store.get("last", 0), LEVELS.length - 1));
openMenu();
requestAnimationFrame(frame);
window.__fc = { G, LEVELS, tapTile, go, selectTool, loadLevel, simulate };   // used by the automated tests
})();
