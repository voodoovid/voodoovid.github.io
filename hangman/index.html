<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chalkboard Hangman</title>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:var(--safe-top, env(safe-area-inset-top, 0px));padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Kalam:wght@300;400;700&display=swap">
<style>
/* Layout: a framed classroom slate; gallows drawing on the left, word + chalk keyboard on the right; stacks on phones.
   Deliberately single-theme: the slate is dark in every viewer theme. */
:root {
  color-scheme: dark;
  --wall: #15100c;
  --wood: #7a5434;
  --wood-dark: #4a311d;
  --slate: #22302b;
  --slate-hi: #2c3d37;
  --chalk: #ece7da;
  --chalk-dim: rgba(236, 231, 218, 0.38);
  --chalk-yellow: #f3d77a;
  --chalk-pink: #f39a92;
  --chalk-green: #aedba3;
  --font-display: "Cabin Sketch", "Comic Sans MS", "Marker Felt", cursive;
  --font-hand: "Kalam", "Segoe Print", "Bradley Hand", cursive;
}
html, body { height: 100%; }
body {
  background: radial-gradient(ellipse at 50% 0%, #2a1f17 0%, var(--wall) 70%);
  color: var(--chalk);
  font-family: var(--font-hand);
  font-size: 17px;
  padding-inline: 16px;
  padding-block: 20px;
  box-sizing: border-box;
}
* { box-sizing: border-box; }

.frame {
  max-width: 980px;
  margin: 0 auto;
  padding: 14px;
  border-radius: 10px;
  background:
    repeating-linear-gradient(92deg, rgba(0,0,0,0.12) 0 3px, transparent 3px 11px),
    linear-gradient(180deg, var(--wood), var(--wood-dark));
  box-shadow: 0 18px 40px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.15);
}
.board {
  position: relative;
  border-radius: 4px;
  padding: 22px clamp(14px, 3vw, 34px) 26px;
  background:
    radial-gradient(ellipse 40% 30% at 20% 30%, rgba(255,255,255,0.05), transparent 70%),
    radial-gradient(ellipse 35% 25% at 75% 70%, rgba(255,255,255,0.04), transparent 70%),
    radial-gradient(ellipse 60% 20% at 60% 15%, rgba(255,255,255,0.035), transparent 70%),
    linear-gradient(160deg, var(--slate-hi), var(--slate));
  box-shadow: inset 0 0 60px rgba(0,0,0,0.5);
  overflow: hidden;
}
.ledge {
  height: 12px; margin: 10px -6px -4px;
  border-radius: 3px;
  background: linear-gradient(180deg, var(--wood), var(--wood-dark));
  box-shadow: 0 4px 6px rgba(0,0,0,0.4);
  position: relative;
}
.ledge::before, .ledge::after {
  content: ""; position: absolute; top: -7px; height: 8px; border-radius: 3px;
}
.ledge::before { left: 18%; width: 46px; background: var(--chalk); transform: rotate(-3deg); }
.ledge::after  { left: 26%; width: 30px; background: var(--chalk-yellow); transform: rotate(4deg); }

header {
  display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px;
  border-bottom: 2px dashed var(--chalk-dim);
  padding-bottom: 10px; margin-bottom: 18px;
}
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(30px, 5vw, 44px);
  margin: 0; line-height: 1;
  letter-spacing: 0.02em;
  text-wrap: balance;
}
h1 span { color: var(--chalk-yellow); }
.head-right { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.music { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; padding: 4px 14px; }
.eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
.eq i { display: block; width: 3px; height: 4px; background: var(--chalk); border-radius: 1px; }
.music[aria-pressed="true"] { border-color: var(--chalk-yellow); color: var(--chalk-yellow); }
.music[aria-pressed="true"] .eq i { background: var(--chalk-yellow); animation: eq 1.4s ease-in-out infinite; }
.music[aria-pressed="true"] .eq i:nth-child(2) { animation-delay: -.5s; }
.music[aria-pressed="true"] .eq i:nth-child(3) { animation-delay: -.9s; }
@keyframes eq { 0%,100% { height: 4px; } 50% { height: 14px; } }
.stats { display: flex; gap: 18px; font-size: 15px; color: var(--chalk-dim); }
.stats b { color: var(--chalk); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 18px; margin-left: 4px; }

.play {
  display: grid;
  grid-template-columns: minmax(0, 340px) minmax(0, 1fr);
  gap: 28px;
  align-items: start;
}
.version { margin: 0; font-size: 12px; color: var(--chalk-dim); text-align: right; font-variant-numeric: tabular-nums; }
.home-link { color: var(--chalk); }
.stage { position: relative; }
canvas { display: block; width: 100%; max-width: 100%; height: auto; aspect-ratio: 300 / 260; }

.side { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.cat {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; justify-content: space-between;
}
.cat-label { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--chalk-dim); }
.cat-name { font-family: var(--font-display); font-size: 26px; color: var(--chalk-yellow); line-height: 1.1; }

.side { container-type: inline-size; }
.word {
  /* one letter's share of the column, capped; the whole word always fits on one line */
  --u: min(46px, calc(100cqw / var(--n, 8)));
  display: flex; flex-wrap: nowrap; gap: calc(var(--u) * 0.18);
  min-height: 64px; align-items: flex-end;
}
.slot {
  flex: 0 1 calc(var(--u) * 0.82); min-width: 0;
  text-align: center;
  font-family: var(--font-display);
  font-size: min(40px, calc(var(--u) * 0.86));
  line-height: 1.1;
  border-bottom: 3px solid var(--chalk);
  border-radius: 0 0 2px 40%;
  height: 1.3em;
}
.slot.space { border-bottom: none; }
.slot .ch { display: inline-block; }
.slot .ch.pop { animation: chalkIn .35s ease-out; }
.slot.missed { color: var(--chalk-pink); }
@keyframes chalkIn {
  from { opacity: 0; transform: translateY(-6px) rotate(-8deg) scale(1.3); filter: blur(2px); }
  to   { opacity: 1; transform: none; filter: none; }
}

.misses {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
  font-size: 15px; color: var(--chalk-dim);
}
.tally { display: inline-flex; gap: 3px; align-items: center; height: 24px; position: relative; }
.tally i { display: block; width: 3px; height: 22px; background: var(--chalk); border-radius: 2px; opacity: .9; transform: rotate(4deg); }
.tally i.empty { background: var(--chalk-dim); opacity: .25; }
.tally .slash {
  position: absolute; left: -4px; width: 32px; height: 3px; top: 10px;
  background: var(--chalk); transform: rotate(-24deg); border-radius: 2px;
}
.wrong-letters { font-family: var(--font-display); font-size: 22px; color: var(--chalk-pink); letter-spacing: .12em; }

.keys { display: flex; flex-direction: column; gap: 7px; }
.row { display: flex; justify-content: center; gap: 6px; }
.key {
  flex: 1 1 0; max-width: 46px; min-width: 0;
  aspect-ratio: 1 / 1.08;
  font-family: var(--font-display);
  font-size: clamp(18px, 3.6vw, 24px);
  color: var(--chalk);
  background: rgba(255,255,255,0.03);
  border: 2px solid var(--chalk-dim);
  border-radius: 9px 7px 10px 6px;
  cursor: pointer;
  padding: 0;
  position: relative;
  transition: transform .12s, background .2s, border-color .2s, color .2s;
}
.key:hover:not(:disabled) { transform: translateY(-2px) rotate(-2deg); border-color: var(--chalk); background: rgba(255,255,255,0.07); }
.key:focus-visible { outline: 3px solid var(--chalk-yellow); outline-offset: 2px; }
.key:disabled { cursor: default; }
.key.hit { color: var(--slate); background: var(--chalk-green); border-color: var(--chalk-green); }
.key.miss { color: var(--chalk-dim); border-color: transparent; background: transparent; }
.key.miss::after {
  content: ""; position: absolute; left: 12%; right: 12%; top: 50%; height: 3px;
  background: var(--chalk-pink); transform: rotate(-30deg); border-radius: 2px;
}

.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  font-family: var(--font-hand); font-weight: 700; font-size: 16px;
  color: var(--chalk); background: transparent;
  border: 2px solid var(--chalk-dim); border-radius: 22px 18px 24px 16px;
  padding: 6px 16px; cursor: pointer;
  transition: border-color .2s, background .2s;
}
.btn:hover:not(:disabled) { border-color: var(--chalk); background: rgba(255,255,255,0.06); }
.btn:focus-visible { outline: 3px solid var(--chalk-yellow); outline-offset: 2px; }
.btn:disabled { opacity: .35; cursor: default; }
.btn.primary { color: var(--slate); background: var(--chalk-yellow); border-color: var(--chalk-yellow); }
.btn.primary:hover { background: #f8e39b; }

select.btn { appearance: none; padding-right: 30px;
  background-image: linear-gradient(45deg, transparent 50%, var(--chalk) 50%), linear-gradient(135deg, var(--chalk) 50%, transparent 50%);
  background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%;
  background-size: 5px 5px; background-repeat: no-repeat; }
select.btn option { background: var(--slate); color: var(--chalk); }

.verdict {
  display: flex; flex-direction: column; gap: 10px; align-items: flex-start;
  padding: 12px 16px; border: 2px dashed var(--chalk-dim); border-radius: 12px 8px 14px 9px;
  animation: chalkIn .4s ease-out;
}
.verdict h2 { font-family: var(--font-display); font-size: 34px; margin: 0; line-height: 1; }
.verdict.win h2 { color: var(--chalk-green); }
.verdict.lose h2 { color: var(--chalk-pink); }
.verdict p { margin: 0; font-size: 16px; }
.type-in {
  /* kept focusable (not display:none) so iPad Safari will raise its keyboard for it */
  position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; padding: 0; border: 0;
  opacity: 0; font-size: 16px; pointer-events: none; caret-color: transparent;
}
#type-btn[aria-pressed="true"] { border-color: var(--chalk-yellow); color: var(--chalk-yellow); }
.hint-line { font-size: 14px; color: var(--chalk-dim); margin: 0; }
kbd { font-family: var(--font-hand); border: 1px solid var(--chalk-dim); border-radius: 4px; padding: 0 5px; font-size: 13px; }

.dust { position: absolute; inset: 0; pointer-events: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
/* Phones held sideways (iPhone 17 Pro Max landscape is about 956x440): everything on one screen,
   the gallows on the left sized to the height, word and letter keys on the right. */
@media (pointer: coarse) and (orientation: landscape) and (max-height: 600px) {
  body { padding-block: 6px; padding-inline: max(8px, env(safe-area-inset-left, 0px)) max(8px, env(safe-area-inset-right, 0px));
         height: calc(100dvh - var(--safe-top, env(safe-area-inset-top, 0px)) - env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column;
         --gh: calc(100dvh - var(--safe-top, env(safe-area-inset-top, 0px)) - env(safe-area-inset-bottom, 0px) - 92px); }
  .frame { max-width: none; width: 100%; flex: 1; min-height: 0; padding: 6px; display: flex; flex-direction: column; }
  .board { flex: 1; min-height: 0; padding: 8px 16px; display: flex; flex-direction: column; }
  .ledge { display: none; }
  header { flex-wrap: nowrap; align-items: center; margin-bottom: 8px; padding-bottom: 6px; gap: 8px 16px; }
  h1 { font-size: 26px; }
  .head-right { flex-wrap: nowrap; gap: 14px; }
  .stats { gap: 12px; font-size: 13px; }
  .stats b { font-size: 15px; }
  .music { font-size: 13px; padding: 3px 12px; }
  .play { flex: 1; min-height: 0; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 22px; align-items: center; }
  .stage { width: min(calc(var(--gh) * 1.1538), 38vw); aspect-ratio: 300 / 260; }
  .stage canvas { width: 100%; height: 100%; }
  .side { gap: 7px; justify-content: center; height: 100%; }
  .cat { flex-wrap: nowrap; gap: 10px; }
  .cat-label { font-size: 11px; }
  .cat-name { font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .cat > div { min-width: 0; }
  .cat select.btn { font-size: 13px; padding-block: 3px; }
  .word { min-height: 0; --u: min(40px, calc(100cqw / var(--n, 8))); }
  .misses { font-size: 13px; }
  .tally { height: 18px; } .tally i { height: 16px; }
  .wrong-letters { font-size: 18px; }
  .keys { gap: 5px; }
  .row { gap: 5px; }
  .key { aspect-ratio: auto; max-width: 52px; height: clamp(28px, calc((var(--gh) - 170px) / 3), 46px); font-size: 18px; }
  .actions { gap: 8px; }
  .actions .btn { font-size: 14px; padding: 3px 12px; }
  .long { display: none; }
  .hint-line { display: none; }
  .version { font-size: 11px; }
  .verdict { padding: 6px 12px; gap: 4px; }
  /* game over: the letter keys step aside for the result and its Next word button */
  .side:has(#verdict:not([hidden])) .keys { display: none; }
  .verdict h2 { font-size: 24px; }
  .verdict p { font-size: 14px; }
}
@media (max-width: 720px), (pointer: coarse) and (orientation: portrait) {
  /* fill the phone's (or a portrait tablet's) visible screen: the board stretches and the extra height goes to bigger letter keys */
  body {
    padding-block: 10px;
    min-height: calc(100vh - var(--safe-top, env(safe-area-inset-top, 0px)) - env(safe-area-inset-bottom, 0px));
    min-height: calc(100dvh - var(--safe-top, env(safe-area-inset-top, 0px)) - env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column;
  }
  .frame { padding: 10px; flex: 1; display: flex; flex-direction: column; width: 100%; }
  .board { padding: 14px 14px 12px; flex: 1; display: flex; flex-direction: column; }
  .ledge { flex: none; }
  header { margin-bottom: 10px; padding-bottom: 8px; }
  h1 { font-size: 30px; }
  .stats { gap: 12px; font-size: 14px; }
  .play {
    grid-template-columns: minmax(0, 42%) minmax(0, 1fr);
    grid-template-areas: "stage cat" "stage misses" "word word" "verdict verdict" "keys keys" "actions actions" "version version";
    column-gap: 14px; row-gap: 12px; align-items: center; align-content: space-between;
    flex: 1;
  }
  .side { display: contents; }
  .stage { grid-area: stage; }
  .cat { grid-area: cat; flex-direction: column; align-items: flex-start; gap: 8px; }
  .cat-name { font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .cat > div { min-width: 0; max-width: 100%; }
  .cat select.btn { font-size: 14px; max-width: 100%; }
  .misses { grid-area: misses; align-self: start; }
  .word { grid-area: word; min-height: 0; --u: min(46px, calc((100vw - 84px) / var(--n, 8))); }
  #verdict { grid-area: verdict; }
  .verdict { padding: 10px 14px; gap: 6px; }
  .verdict h2 { font-size: 28px; }
  .keys { grid-area: keys; gap: 6px; }
  .row { gap: 5px; }
  .key { aspect-ratio: auto; height: 40px; height: clamp(38px, 6dvh, 60px); }
  .actions { grid-area: actions; gap: 8px; }
  .actions { flex-wrap: nowrap; }
  .actions .btn { font-size: 14px; padding: 5px 8px; flex: 1 1 auto; white-space: nowrap; }
  .verdict { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 12px; row-gap: 2px; }
  .verdict p { grid-column: 1; font-size: 15px; }
  .verdict .btn { grid-column: 2; grid-row: 1 / span 2; }
  .long, .hint-line { display: none; }
  .version { grid-area: version; }
}
</style>
</head>
<body>
<!-- Shared "back to the games menu" button: identical in every game on the site -->
<a class="games-pill" id="gamesPill" href="../" hidden aria-label="Back to the games menu">&lsaquo; Games</a>
<style>
.games-pill { position: fixed; z-index: 9999; top: calc(var(--safe-top, env(safe-area-inset-top, 0px)) + 10px); left: calc(env(safe-area-inset-left, 0px) + 8px);
  display: inline-flex; align-items: center; gap: 3px; height: 34px; padding: 0 14px 0 11px; box-sizing: border-box; border-radius: 17px;
  background: #ffd166; color: #241a05; border: 2px solid #fff3c4; box-shadow: 0 2px 10px rgba(0,0,0,.5);
  font: 700 15px/1 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .01em; text-decoration: none; -webkit-tap-highlight-color: transparent; }
.games-pill:active { transform: scale(.95); }
.games-pill:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.games-pill[hidden] { display: none !important; }
</style>
<script>
(() => {
  const pill = document.getElementById("gamesPill");
  // Where the status bar ends. The installed app sometimes reports 0 here (after the device turns), which put this button
  // and the titles under the blurred status bar. So in the app use at least the status bar's height, plus a little air.
  const safeTop = () => {
    const d = document.documentElement, p = document.createElement("div");
    p.style.cssText = "position:fixed;top:0;left:0;width:0;visibility:hidden;height:env(safe-area-inset-top,0px)";
    d.appendChild(p); let t = p.offsetHeight; p.remove();
    if (navigator.standalone || matchMedia("(display-mode: standalone)").matches)
      t = Math.max(t, Math.min(screen.width, screen.height) >= 700 ? 24 : innerHeight > innerWidth ? 54 : 0) + 8;
    d.style.setProperty("--safe-top", t + "px");
  };
  safeTop(); addEventListener("resize", safeTop); addEventListener("orientationchange", () => setTimeout(safeTop, 250));
  // Only on the games site, not when a page is opened on its own
  if (!/\/(hangman|scareisdale|ponchos-adventure|ponchos-adventure-3d|flip-five|flip-five-3d|follow-chestnut)\//.test(location.pathname)) return;
  pill.hidden = false;
  // Lock the screen: no rubber-band bounce or drag when swiping, except inside something that really scrolls
  document.documentElement.style.overscrollBehavior = "none"; document.body.style.overscrollBehavior = "none";
  const canScroll = el => {
    for (; el && el !== document.documentElement; el = el.parentElement) {
      if (el.closest && el.closest("input, textarea, select")) return true;
      const s = getComputedStyle(el);
      if (/(auto|scroll)/.test(s.overflowY + s.overflowX) && (el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1)) return true;
    }
    const d = document.documentElement;
    return d.scrollHeight > innerHeight + 1 || d.scrollWidth > innerWidth + 1;
  };
  document.addEventListener("touchmove", e => { if (e.touches.length === 1 && e.cancelable && !canScroll(e.target)) e.preventDefault(); }, { passive: false });
  // Nudge the game's top row right so nothing sits under the button
  const fit = () => {
    for (const el of document.querySelectorAll("[data-pill-gap]")) {
      el.style.paddingLeft = "";
      const p = pill.getBoundingClientRect(), r = el.getBoundingClientRect();
      if (r.height && r.top < p.bottom + 4 && r.bottom > p.top) {
        const need = Math.ceil(p.right + 10 - r.left);
        if (need > 0) { el.style.boxSizing = "border-box"; el.style.paddingLeft = need + "px"; }
      }
    }
  };
  addEventListener("DOMContentLoaded", fit); addEventListener("load", fit); addEventListener("resize", fit);
  addEventListener("orientationchange", () => setTimeout(fit, 250));
  if (document.fonts) document.fonts.ready.then(fit);
})();
</script>

<div class="frame">

<script>
(() => {
const VERSION = "v1.11";

const MAX_MISSES = 6;
const ROWS = ["qwertyuiop","asdfghjkl","zxcvbnm"];
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

const $ = id => document.getElementById(id);
const els = { word: $("word"), keys: $("keys"), tally: $("tally"), wrong: $("wrong"), verdict: $("verdict"),
  cat: $("cat-name"), pick: $("cat-pick"), hint: $("hint"), next: $("new") };

/* ---------- state ---------- */
let S;
let stats = { win: 0, lose: 0, streak: 0 };
try { const s = JSON.parse(localStorage.getItem("hangman-stats") || "null"); if (s) stats = s; } catch (e) {}
function saveStats() { try { localStorage.setItem("hangman-stats", JSON.stringify(stats)); } catch (e) {} }

function pickWord(choice) {
  const cats = Object.keys(WORDS);
  const cat = choice && choice !== "Any" ? choice : cats[Math.floor(Math.random() * cats.length)];
  const list = WORDS[cat];
  let w;
  do { w = list[Math.floor(Math.random() * list.length)]; } while (S && w === S.word && list.length > 1);
  return { cat, word: w };
}
function newRound() {
  const { cat, word } = pickWord(els.pick.value);
  S = { cat, word, guessed: [], misses: 0, over: null, choice: els.pick.value };
  resetDrawing();
  render(true);
}
const letters = () => [...new Set(S.word.replace(/ /g, ""))];
const solved = () => letters().every(l => S.guessed.includes(l));

function guess(l) {
  if (!S || S.over || S.guessed.includes(l)) return;
  Music.click();
  S.guessed.push(l);
  if (!S.word.includes(l)) { S.misses++; scheduleParts(); }
  checkEnd();
  render(false, l);
}
function hint() {
  if (S.over || S.misses >= MAX_MISSES - 1) return;
  const left = letters().filter(l => !S.guessed.includes(l));
  if (!left.length) return;
  const l = left[Math.floor(Math.random() * left.length)];
  S.guessed.push(l);
  S.misses++;
  scheduleParts();
  checkEnd();
  render(false, l);
}
function checkEnd() {
  if (solved()) { S.over = "win"; stats.win++; stats.streak++; saveStats(); celebrate(); if (S.misses === 0) Music.jackpot(); }
  else if (S.misses >= MAX_MISSES) { S.over = "lose"; stats.lose++; stats.streak = 0; saveStats(); Music.sadTrombone(); }
  if (S.over) scheduleParts();
}

/* ---------- DOM render ---------- */
function buildKeys() {
  els.keys.innerHTML = "";
  ROWS.forEach(r => {
    const row = document.createElement("div"); row.className = "row";
    [...r].forEach(ch => {
      const b = document.createElement("button");
      b.className = "key"; b.textContent = ch.toUpperCase(); b.dataset.k = ch; b.id = "key-" + ch;
      b.setAttribute("aria-label", "Guess " + ch.toUpperCase());
      b.addEventListener("click", () => guess(ch));
      row.appendChild(b);
    });
    els.keys.appendChild(row);
  });
}
function render(fresh, justGuessed) {
  els.cat.textContent = S.cat;
  // word
  els.word.innerHTML = "";
  els.word.style.setProperty("--n", S.word.length);
  [...S.word].forEach(ch => {
    const s = document.createElement("span");
    if (ch === " ") { s.className = "slot space"; els.word.appendChild(s); return; }
    s.className = "slot";
    const shown = S.guessed.includes(ch);
    if (shown || S.over === "lose") {
      const c = document.createElement("span");
      c.className = "ch" + ((ch === justGuessed || (!shown && S.over)) ? " pop" : "");
      c.textContent = ch.toUpperCase();
      s.appendChild(c);
      if (!shown) s.classList.add("missed");
    }
    els.word.appendChild(s);
  });
  els.word.setAttribute("aria-label", [...S.word].map(c => c === " " ? "space" : (S.guessed.includes(c) ? c : "blank")).join(" "));
  // keys
  els.keys.querySelectorAll(".key").forEach(b => {
    const k = b.dataset.k, g = S.guessed.includes(k);
    b.classList.toggle("hit", g && S.word.includes(k));
    b.classList.toggle("miss", g && !S.word.includes(k));
    b.disabled = g || !!S.over;
  });
  // tally: chalk tally marks, 5 + 1
  els.tally.innerHTML = "";
  for (let i = 0; i < MAX_MISSES; i++) {
    const m = document.createElement("i");
    if (i >= S.misses) m.className = "empty";
    els.tally.appendChild(m);
    if (i === 4 && S.misses >= 5) {
      const sl = document.createElement("span"); sl.className = "slash"; els.tally.appendChild(sl);
    }
  }
  els.tally.setAttribute("aria-label", `${S.misses} of ${MAX_MISSES} misses`);
  els.wrong.textContent = S.guessed.filter(l => !S.word.includes(l)).join(" ").toUpperCase();
  // verdict
  if (S.over) {
    const win = S.over === "win";
    els.verdict.className = "verdict " + S.over;
    els.verdict.innerHTML = `<h2>${win ? "Saved!" : "Hanged."}</h2>
      <p>${win ? `You got <b>${S.word.toUpperCase()}</b> with ${MAX_MISSES - S.misses} miss${MAX_MISSES - S.misses === 1 ? "" : "es"} to spare.`
               : `The word was <b>${S.word.toUpperCase()}</b>.`}</p>
      <button class="btn primary" id="again">Next word</button>`;
    els.verdict.hidden = false;
    $("again").addEventListener("click", newRound);
    if (!fresh && document.activeElement !== typeIn) $("again").focus({ preventScroll: true });
  } else {
    els.verdict.hidden = true;
  }
  els.hint.disabled = !!S.over || S.misses >= MAX_MISSES - 1;
  $("s-win").textContent = stats.win;
  $("s-lose").textContent = stats.lose;
  $("s-streak").textContent = stats.streak;
}

/* ---------- chalk drawing ---------- */
const cv = $("gallows"), ctx = cv.getContext("2d");
const W = 300, H = 260;
function fitCanvas(c, cx) {
  // sharp at any size: account for the board's zoom on big screens and the canvas's displayed width
  const zoom = parseFloat(document.querySelector(".frame").style.zoom) || 1;
  const dpr = Math.min(window.devicePixelRatio || 1, 3) * zoom * Math.max(1, c.clientWidth / W);
  c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
fitCanvas(cv, ctx);

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const line = (x1, y1, x2, y2) => { const n = Math.max(8, Math.hypot(x2 - x1, y2 - y1) / 5 | 0); return Array.from({ length: n + 1 }, (_, i) => [x1 + (x2 - x1) * i / n, y1 + (y2 - y1) * i / n]); };
const arc = (cx, cy, r, a0, a1) => { const n = Math.max(10, Math.abs(a1 - a0) * r / 5 | 0); return Array.from({ length: n + 1 }, (_, i) => { const a = a0 + (a1 - a0) * i / n; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; }); };

const CHALK = "236,231,218", PINK = "243,154,146", GREEN = "174,219,163";
const P = {
  base:  { pts: [line(22, 250, 210, 248)], w: 5 },
  pole:  { pts: [line(62, 249, 60, 14)], w: 5 },
  beam:  { pts: [line(52, 16, 196, 18)], w: 5 },
  brace: { pts: [line(61, 62, 108, 17)], w: 4 },
  rope:  { pts: [line(190, 18, 191, 46)], w: 3 },
  head:  { pts: [arc(191, 68, 22, -Math.PI / 2, Math.PI * 1.55)], w: 3.5 },
  body:  { pts: [line(191, 90, 190, 160)], w: 3.5 },
  armL:  { pts: [line(190, 108, 158, 142)], w: 3.5 },
  armR:  { pts: [line(190, 108, 223, 140)], w: 3.5 },
  legL:  { pts: [line(190, 159, 164, 212)], w: 3.5 },
  legR:  { pts: [line(190, 159, 217, 211)], w: 3.5 },
  dead:  { pts: [line(180, 59, 187, 66), line(187, 59, 180, 66), line(195, 59, 202, 66), line(202, 59, 195, 66), arc(191, 85, 7, -Math.PI * 0.85, -Math.PI * 0.15)], w: 2.5, color: PINK },
  happy: { pts: [arc(183, 63, 2, 0, Math.PI * 2), arc(199, 63, 2, 0, Math.PI * 2), arc(191, 71, 9, Math.PI * 0.15, Math.PI * 0.85)], w: 2.5, color: GREEN },
};
const GALLOWS = ["base", "pole", "beam", "brace", "rope"];
const BODY = ["head", "body", "armL", "armR", "legL", "legR"];
Object.keys(P).forEach((k, i) => P[k].seed = 1000 + i * 97);

let progress = {};   // part -> 0..1
let queue = [];      // parts waiting to animate
function resetDrawing() {
  progress = {}; queue = [];
  scheduleParts();
}
function wantedParts() {
  const want = [...GALLOWS, ...BODY.slice(0, S.misses)];
  if (S.over === "lose") want.push("dead");
  if (S.over === "win" && S.misses >= 1) want.push("happy");
  return want;
}
function scheduleParts() {
  wantedParts().forEach(k => { if (!(k in progress) && !queue.includes(k)) queue.push(k); });
  kick();
}

function drawPart(k, t) {
  const p = P[k]; if (t <= 0) return;
  const r = rng(p.seed);
  const col = p.color || CHALK;
  const total = p.pts.reduce((a, s) => a + s.length, 0);
  let budget = Math.ceil(total * t);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  const strokes = [];
  for (const seg of p.pts) {
    if (budget <= 1) break;
    const n = Math.min(seg.length, budget); budget -= n;
    strokes.push(seg.slice(0, n));
  }
  // three passes of grainy chalk, each slightly offset
  [[p.w, 0.55], [p.w * 0.6, 0.6], [p.w * 0.35, 0.8]].forEach(([w, a], pass) => {
    const ox = (r() - 0.5) * 1.6, oy = (r() - 0.5) * 1.6;
    ctx.strokeStyle = `rgba(${col},${a})`;
    ctx.lineWidth = w;
    for (const s of strokes) {
      ctx.beginPath();
      s.forEach(([x, y], i) => {
        const jx = x + ox + (r() - 0.5) * 1.1, jy = y + oy + (r() - 0.5) * 1.1;
        i ? ctx.lineTo(jx, jy) : ctx.moveTo(jx, jy);
      });
      ctx.stroke();
    }
  });
  // knock out specks so it reads as chalk on a rough surface
  ctx.globalCompositeOperation = "destination-out";
  for (const s of strokes) for (const [x, y] of s) {
    for (let j = 0; j < 3; j++) {
      ctx.fillStyle = `rgba(0,0,0,${0.35 + r() * 0.5})`;
      ctx.fillRect(x + (r() - 0.5) * p.w * 1.6, y + (r() - 0.5) * p.w * 1.6, 0.6 + r() * 1.3, 0.6 + r() * 1.3);
    }
  }
  ctx.globalCompositeOperation = "source-over";
  // dust at the stroke tip while drawing
  if (t < 1 && strokes.length) {
    const last = strokes[strokes.length - 1].at(-1);
    puff(last[0], last[1], 1);
  }
}

let raf = null, lastTs = 0;
function kick() { if (!raf) { lastTs = performance.now(); raf = requestAnimationFrame(frame); } }
function frame(ts) {
  const dt = Math.min(50, ts - lastTs); lastTs = ts;
  if (queue.length) {
    const k = queue[0];
    if (!(k in progress)) progress[k] = 0;
    const speed = GALLOWS.includes(k) ? 1 / 260 : 1 / 420;
    progress[k] = reduceMotion ? 1 : Math.min(1, progress[k] + dt * speed);
    if (progress[k] >= 1) queue.shift();
  }
  ctx.clearRect(0, 0, W, H);
  Object.keys(progress).forEach(k => drawPart(k, progress[k]));
  const dustAlive = stepDust(dt);
  raf = (queue.length || dustAlive) ? requestAnimationFrame(frame) : null;
}

/* ---------- chalk dust particles ---------- */
const dc = $("dust"), dctx = dc.getContext("2d");
fitCanvas(dc, dctx);

/* ---------- big screens (iPad, desktop): scale the whole chalkboard up to fill the screen ---------- */
const frameEl = document.querySelector(".frame");
function fitBoard() {
  frameEl.style.zoom = "";
