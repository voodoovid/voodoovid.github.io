<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06142b">
<title>Fathom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Righteous&display=swap">
<style>
/* Layout: the ocean (a canvas) fills the screen; the game sits on a glass card over it, at the top so the
   on-screen keyboard never covers it. On wide screens the card sits on the left and the submarine sinks on the right.
   Single dark theme by design: the deep sea is always dark. */
:root {
  color-scheme: dark;
  --ink: #eaf6ff;
  --dim: #9db7cf;
  --glass: rgba(6, 22, 46, .72);
  --glass-hi: rgba(20, 52, 92, .75);
  --line: rgba(160, 215, 255, .22);
  --cyan: #7fe3ff;
  --gold: #ffd166;
  --coral: #ff7a6b;
  --t0: #8fe3ff; --t1: #5ad1c9; --t2: #7d97ff; --t3: #b07cff; --t4: #ff6fb5; --t5: #ffd166;
  --font: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
  --display: "Righteous", "Nunito", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #06142b; color: var(--ink); font-family: var(--font);
  overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#sea { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

#app { position: fixed; inset: 0; display: flex; flex-direction: column; pointer-events: none;
  padding: calc(var(--safe-top, env(safe-area-inset-top, 0px)) + 10px) calc(env(safe-area-inset-right, 0px) + 12px) calc(env(safe-area-inset-bottom, 0px) + 10px) calc(env(safe-area-inset-left, 0px) + 12px); }
#app > * { pointer-events: auto; }
.top { display: flex; align-items: center; gap: 10px; min-height: 44px; margin-bottom: 10px; }
.brand { font-family: var(--display); font-size: 26px; letter-spacing: .04em; flex: 1; min-width: 0; text-shadow: 0 2px 12px rgba(0,0,0,.5); }
.brand small { white-space: nowrap; font-family: var(--font); font-size: 12px; color: var(--dim); letter-spacing: .02em; margin-left: 6px; font-weight: 600; }
.pill { height: 36px; padding: 0 14px; border-radius: 18px; background: var(--glass); border: 1px solid var(--line); font-weight: 800; font-size: 14px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); white-space: nowrap; }
.pill:active { transform: scale(.96); }

.card { width: 100%; max-width: 600px; margin: 0 auto; padding: 18px 18px 16px; border-radius: 22px; background: var(--glass);
  border: 1px solid var(--line); box-shadow: 0 20px 50px rgba(0,0,0,.45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  max-height: 100%; overflow-y: auto; overscroll-behavior: contain; }
.card h1 { font-family: var(--display); font-weight: 400; font-size: 34px; margin: 0 0 6px; line-height: 1.05; }
.card p { margin: 0 0 12px; line-height: 1.45; color: var(--dim); }
.card p b { color: var(--ink); }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 54px; padding: 10px 18px; border-radius: 16px;
  font-weight: 800; font-size: 18px; background: linear-gradient(180deg, #ffe08f, #ffc23d); color: #2a1d00; box-shadow: 0 4px 0 #b9821a, 0 8px 20px rgba(0,0,0,.35); margin-top: 10px; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b9821a; }
.btn.alt { background: var(--glass-hi); color: var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,.45); border: 1px solid var(--line); }
.btn.alt:active { box-shadow: 0 1px 0 rgba(0,0,0,.45); }
.btn { flex-wrap: wrap; row-gap: 0; text-align: center; }
.btn > span, .btn small { white-space: nowrap; }
.btn small { font-weight: 600; opacity: .75; font-size: 14px; }
.how { margin: 14px 0 0; padding: 12px 14px; border-radius: 14px; background: rgba(0,0,0,.22); font-size: 15px; line-height: 1.45; color: var(--dim); }
.how b { color: var(--ink); }
.tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.tier { padding: 6px 8px; border-radius: 10px; background: rgba(255,255,255,.05); font-size: 13px; line-height: 1.25; }
.tier b { display: block; font-size: 14px; }
.statline { display: flex; gap: 8px; margin-top: 12px; }
.stat { flex: 1; padding: 8px 6px; border-radius: 12px; background: rgba(0,0,0,.22); text-align: center; }
.stat b { display: block; font-size: 20px; font-family: var(--display); font-weight: 400; }
.stat span { font-size: 12px; color: var(--dim); }

/* Round */
.roundhead { display: flex; align-items: center; justify-content: space-between; color: var(--dim); font-weight: 800; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; }
.dots { display: flex; gap: 6px; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.18); }
.dot.now { background: var(--ink); box-shadow: 0 0 10px var(--cyan); }
.prompt { font-family: var(--display); font-size: clamp(28px, 7.5vw, 44px); line-height: 1.08; margin: 12px 0 14px; text-wrap: balance; min-height: 1.1em; }
.timer { position: relative; height: 12px; border-radius: 6px; background: rgba(255,255,255,.1); overflow: hidden; }
.timer i { position: absolute; inset: 0; transform-origin: left; background: linear-gradient(90deg, var(--cyan), #6fffd4); border-radius: 6px; }
.timer.low i { background: linear-gradient(90deg, var(--coral), #ffb26b); }
.timerow { display: flex; align-items: center; gap: 10px; }
.timerow .timer { flex: 1; }
.secs { font-family: var(--display); font-size: 22px; min-width: 36px; text-align: right; font-variant-numeric: tabular-nums; }
.entry { display: flex; gap: 8px; margin-top: 14px; }
.entry input { flex: 1; min-width: 0; height: 56px; padding: 0 16px; border-radius: 16px; border: 2px solid var(--line); background: rgba(0,0,0,.35);
  color: var(--ink); font: 800 20px var(--font); -webkit-appearance: none; appearance: none; }
.entry input:focus { border-color: var(--cyan); outline: none; }
.entry .btn { width: auto; margin: 0; min-height: 56px; padding: 0 20px; }
.feedback { min-height: 26px; margin-top: 10px; font-weight: 800; font-size: 16px; color: var(--coral); }
.feedback.ok { color: var(--cyan); }
.shake { animation: shake .32s; }
@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }

/* Reveal */
.reveal { text-align: center; }
.reveal .ans { font-family: var(--display); font-size: clamp(30px, 8vw, 46px); line-height: 1.05; margin: 6px 0 2px; overflow-wrap: anywhere; }
.reveal .tiername { display: inline-block; margin-top: 8px; padding: 6px 16px; border-radius: 20px; font-weight: 800; font-size: 18px; color: #06142b; }
.reveal .gain { margin-top: 10px; font-size: 18px; font-weight: 800; }
.reveal .deeper { margin-top: 12px; font-size: 15px; color: var(--dim); line-height: 1.4; }
.reveal .deeper b { color: var(--ink); }
.pop { animation: pop .45s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* End */
.big { font-family: var(--display); font-size: clamp(48px, 13vw, 72px); line-height: 1; text-align: center; margin: 6px 0 0; }
.band { text-align: center; font-weight: 800; font-size: 20px; color: var(--gold); margin: 4px 0 12px; }
.log { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; }
.log li { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 10px; background: rgba(0,0,0,.2); font-size: 15px; }
.log li .q { color: var(--dim); font-size: 13px; display: block; }
.log li .m { font-weight: 800; font-variant-numeric: tabular-nums; }
.row2 { display: flex; gap: 8px; }
.row2 .btn { flex: 1; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); padding: 10px 18px; border-radius: 20px;
  background: rgba(0,0,0,.8); font-weight: 800; z-index: 50; pointer-events: none; transition: opacity .3s; }
.version { position: fixed; right: calc(env(safe-area-inset-right, 0px) + 10px); bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); font-size: 11px; color: rgba(200,225,255,.45); pointer-events: none; }

/* Wide screens (iPad landscape, desktop): the card on the left, the dive on the right */
@media (min-width: 900px) and (orientation: landscape) {
  #app { padding-left: calc(env(safe-area-inset-left, 0px) + 28px); }
  .card { margin: 0; max-width: min(46vw, 640px); padding: 26px 28px 22px; }
  .card h1 { font-size: 44px; }
  .prompt { font-size: clamp(40px, 4.2vw, 58px); }
  .reveal .ans { font-size: 56px; }
  .entry input, .entry .btn { height: 64px; min-height: 64px; font-size: 22px; }
  .brand { font-size: 30px; }
}
@media (max-width: 520px) { .brand small { display: none; } }
/* Short phones in landscape: tighter */
@media (max-height: 500px) {
  .card { padding: 12px 14px; }
  .prompt { margin: 6px 0 8px; font-size: 26px; }
  .how { display: none; }
}
</style>
</head>
<body>
<a class="games-pill" id="gamesPill" href="../" hidden aria-label="Back to the games menu">&lsaquo; Games</a>
<style>
.games-pill { position: fixed; z-index: 9999; top: calc(var(--safe-top, env(safe-area-inset-top, 0px)) + 10px); left: calc(env(safe-area-inset-left, 0px) + 8px);
  display: inline-flex; align-items: center; gap: 3px; height: 34px; padding: 0 14px 0 11px; box-sizing: border-box; border-radius: 17px;
  background: #ffd166; color: #241a05; border: 2px solid #fff3c4; box-shadow: 0 2px 10px rgba(0,0,0,.5);
  font: 700 15px/1 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .01em; text-decoration: none; -webkit-tap-highlight-color: transparent; }
.games-pill:active { transform: scale(.95); }
.games-pill:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.games-pill[hidden] { display: none !important; }
</style>
<script>
(() => {
  const pill = document.getElementById("gamesPill");
  // Where the status bar ends. The installed app sometimes reports 0 here (after the device turns), which put this button
  // and the titles under the blurred status bar. So in the app use at least the status bar's height, plus a little air.
  const safeTop = () => {
    const d = document.documentElement, p = document.createElement("div");
    p.style.cssText = "position:fixed;top:0;left:0;width:0;visibility:hidden;height:env(safe-area-inset-top,0px)";
    d.appendChild(p); let t = p.offsetHeight; p.remove();
    if (navigator.standalone || matchMedia("(display-mode: standalone)").matches)
      t = Math.max(t, Math.min(screen.width, screen.height) >= 700 ? 24 : innerHeight > innerWidth ? 54 : 16) + 8;
    d.style.setProperty("--safe-top", t + "px");
  };
  safeTop(); addEventListener("resize", safeTop); addEventListener("orientationchange", () => setTimeout(safeTop, 250));
  // Only on the games site, not when a page is opened on its own
  if (!/\/(hangman|scareisdale|ponchos-adventure|ponchos-adventure-3d|flip-five|flip-five-3d|follow-chestnut|fathom)\//.test(location.pathname)) return;
  pill.hidden = false;
  // Lock the screen: no rubber-band bounce or drag when swiping, except inside something that really scrolls
  document.documentElement.style.overscrollBehavior = "none"; document.body.style.overscrollBehavior = "none";
  const canScroll = el => {
    for (; el && el !== document.documentElement; el = el.parentElement) {
      if (el.closest && el.closest("input, textarea, select")) return true;
      const s = getComputedStyle(el);
      if (/(auto|scroll)/.test(s.overflowY + s.overflowX) && (el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1)) return true;
    }
    const d = document.documentElement;
    return d.scrollHeight > innerHeight + 1 || d.scrollWidth > innerWidth + 1;
  };
  document.addEventListener("touchmove", e => { if (e.touches.length === 1 && e.cancelable && !canScroll(e.target)) e.preventDefault(); }, { passive: false });
  // Nudge the game's top row right so nothing sits under the button
  const fit = () => {
    for (const el of document.querySelectorAll("[data-pill-gap]")) {
      el.style.paddingLeft = "";
      const p = pill.getBoundingClientRect(), r = el.getBoundingClientRect();
      if (r.height && r.top < p.bottom + 4 && r.bottom > p.top) {
        const need = Math.ceil(p.right + 10 - r.left);
        if (need > 0) { el.style.boxSizing = "border-box"; el.style.paddingLeft = need + "px"; }
      }
    }
  };
  addEventListener("DOMContentLoaded", fit); addEventListener("load", fit); addEventListener("resize", fit);
  addEventListener("orientationchange", () => setTimeout(fit, 250));
  if (document.fonts) document.fonts.ready.then(fit);
  // A tap on the button always goes back, even when iOS drops the click (it can after the phone is turned sideways):
  // watch touches for the whole page, before the game sees them, and treat a short tap on or just around the button as a press
  const near = (x, y) => { const r = pill.getBoundingClientRect(); return x > r.left - 10 && x < r.right + 10 && y > r.top - 10 && y < r.bottom + 10; };
  let tap = null;
  addEventListener("touchstart", e => { const t = e.touches[0]; tap = e.touches.length === 1 && near(t.clientX, t.clientY) ? [t.clientX, t.clientY] : null; }, { capture: true, passive: true });
  addEventListener("touchend", e => {
    const t = e.changedTouches[0];
    if (tap && near(t.clientX, t.clientY) && Math.hypot(t.clientX - tap[0], t.clientY - tap[1]) < 30) { if (e.cancelable) e.preventDefault(); location.href = pill.href; }
    tap = null;
  }, { capture: true, passive: false });
  // after turning, lay the button out afresh so where it is drawn and where it answers taps agree
  addEventListener("orientationchange", () => setTimeout(() => { pill.style.display = "none"; void pill.offsetWidth; pill.style.display = ""; if (scrollY || scrollX) scrollTo(0, 0); }, 300));
})();
</script>

<canvas id="sea" aria-hidden="true"></canvas>
<div id="app">
  <header class="top" data-pill-gap>
    <div class="brand">Fathom<small id="modeLabel"></small></div>
    <button class="pill" id="btnSound" aria-label="Sound">♪ On</button>
    <button class="pill" id="btnHome" hidden>Quit dive</button>

  <main class="card" id="card" aria-live="polite"></main>
</div>
<div class="toast" id="toast" style="opacity:0"></div>
<div class="version" id="version"></div>

<script src="prompts.js"></script>
<script>
(() => {
"use strict";
const VERSION = "v1.4";
const ROUNDS = 7, ROUND_SECS = 25, WRONG_PENALTY = 3, M_PER_POINT = 4;
const $ = id => document.getElementById(id);
const KEY = "fathom.";
const store = {
  get(k, d) { try { const v = localStorage.getItem(KEY + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} },
};
$("version").textContent = "Fathom " + VERSION;
if ("serviceWorker" in navigator && location.pathname.includes("/fathom/"))
  navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(() => {});

// ---------- Prompts ----------
// The prompts and their ranked answers live in prompts.js (loaded before this script).
const CATS = window.FATHOM_PROMPTS || [];

// ---------- Matching ----------
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/&/g, "and")
  .replace(/^(the|a|an)\s+/, "").replace(/[^a-z0-9]/g, "");
const stems = k => {
  const out = [k];
  if (k.length > 3 && k.endsWith("ies")) out.push(k.slice(0, -3) + "y");
  if (k.length > 3 && k.endsWith("es")) out.push(k.slice(0, -2));
  if (k.length > 2 && k.endsWith("s") && !k.endsWith("ss")) out.push(k.slice(0, -1));
  return out;
};
function lev(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i]; let best = i;
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (j > 1 && i > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) cur[j] = Math.min(cur[j], prev[j - 2] + 1);
      best = Math.min(best, cur[j]);
    }
    if (best > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}
const SMALL = new Set(["and", "of", "the", "in", "on", "a", "an", "at", "to", "de", "del", "la", "le", "di", "da", "du", "von", "van", "s"]);
const title = s => s.split(" ").map((w, i) => i && SMALL.has(w) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
// Build each prompt's answer table once: display name, rank (0 = most common) and lookup keys
const TABLES = CATS.map(([prompt, list]) => {
  const answers = [], index = new Map();
  for (const entry of list.split("|")) {
    const names = entry.split("/").map(s => s.trim()).filter(Boolean);
    if (!names.length) continue;
    const keys = names.map(norm).filter(Boolean);
    if (keys.some(k => index.has(k))) continue;      // the same answer listed twice: keep the first (more common) spot
    const a = { name: title(names[0]), rank: answers.length, keys };
    answers.push(a);
    for (const k of keys) for (const s of stems(k)) if (!index.has(s)) index.set(s, a);
  }
  return { prompt, answers, index };
});
function lookup(t, raw) {
  const k = norm(raw);
  if (!k) return null;
  for (const s of stems(k)) if (t.index.has(s)) return t.index.get(s);
  // a small typo: one slip for most words, two for long ones
  const max = k.length >= 9 ? 2 : k.length >= 5 ? 1 : 0;
  if (!max) return null;
  let best = null, bd = max + 1;
  for (const a of t.answers) for (const key of a.keys) {
    if (key.length < 4) continue;
    const d = lev(k, key, max);
    if (d < bd || (d === bd && best && a.rank < best.rank)) { bd = d; best = a; }
  }
  return bd <= max ? best : null;
}

// ---------- Depth tiers ----------
const TIERS = [
  { name: "Surface",  pts: 10,  color: "var(--t0)", hex: "#8fe3ff", emoji: "🫧", note: "everyone says it" },
  { name: "Sunlit",   pts: 25,  color: "var(--t1)", hex: "#5ad1c9", emoji: "🐠", note: "a popular pick" },
  { name: "Twilight", pts: 40,  color: "var(--t2)", hex: "#7d97ff", emoji: "🪼", note: "a solid find" },
  { name: "Midnight", pts: 60,  color: "var(--t3)", hex: "#b07cff", emoji: "🦑", note: "not many go here" },
  { name: "Abyss",    pts: 80,  color: "var(--t4)", hex: "#ff6fb5", emoji: "🐙", note: "a rare answer" },
  { name: "Hadal",    pts: 100, color: "var(--t5)", hex: "#ffd166", emoji: "💎", note: "almost nobody thinks of it" },
];
const ABS = [4, 10, 20, 35, 55], FRAC = [.12, .25, .4, .6, .8];
function tierOf(a, t) {
  const n = t.answers.length;
  const abs = ABS.filter(x => a.rank >= x).length, frac = FRAC.filter(x => a.rank / n >= x).length;
  return Math.max(abs, frac);
}
const BANDS = [[0, "Paddler"], [700, "Reef Diver"], [1200, "Twilight Drifter"], [1700, "Midnight Diver"], [2200, "Abyss Walker"], [2600, "Trench Legend"]];
const bandOf = m => BANDS.filter(b => m >= b[0]).pop()[1];

// ---------- Daily prompts ----------
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffled(n, r) { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const todayKey = (d = new Date()) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const dayNumber = key => Math.round((Date.UTC(...key.split("-").map((v, i) => i === 1 ? v - 1 : +v)) - Date.UTC(2026, 9, 12)) / 864e5);
// Walk through every prompt in a shuffled order, a new order each pass, so a prompt comes back only after all the others
function dailyCats(key) {
  const n = TABLES.length, d = dayNumber(key), start = ((d % 100000) + 100000) * ROUNDS;
  const out = [];
  for (let i = start; out.length < ROUNDS; i++) {
    const pass = Math.floor(i / n), c = shuffled(n, rng(9173 + pass * 7919))[i % n];
    if (!out.includes(c)) out.push(c);
  }
  return out;
}

// ---------- Game state ----------
const G = {
  screen: "home", mode: "daily", key: todayKey(), cats: [], round: 0,
  results: [],        // { cat, answer, tier, pts } per round (answer null when time ran out)
  left: ROUND_SECS, last: 0, paused: false,
  depth: 0, shown: 0, // metres reached, metres currently drawn
};
const totalPts = () => G.results.reduce((s, r) => s + r.pts, 0);
const stats = () => store.get("stats", { played: 0, best: 0, streak: 0, lastDay: null, maxStreak: 0, tiers: [0, 0, 0, 0, 0, 0] });
function saveDaily() { const all = store.get("daily", {}); all[G.key] = { cats: G.cats, results: G.results, done: G.results.length >= ROUNDS }; store.set("daily", all); }

// ---------- Screens ----------
const card = $("card");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = n => n.toLocaleString("en-US");
function setMode(label) { $("modeLabel").textContent = label; }

function showHome() {
  G.screen = "home"; $("btnHome").hidden = true; setMode("");
  G.key = todayKey();
  const today = store.get("daily", {})[G.key], s = stats();
  const doneToday = today && today.done, midway = today && !today.done && today.results.length;
  const dPts = today ? today.results.reduce((a, r) => a + r.pts, 0) : 0;
  G.depth = 0; Sea.target(0);
  card.innerHTML = `
    <h1>How deep can you go?</h1>
    <p>Each prompt asks you to name something. <b>Common answers keep you near the surface. Rare ones sink you deep.</b> Seven prompts, ${ROUND_SECS} seconds each.</p>
    <button class="btn" id="goDaily">${doneToday ? `<span>Today's dive: ${fmt(dPts * M_PER_POINT)} m</span> <small>· see it</small>` : midway ? `<span>Resume today's dive</span> <small>· prompt ${today.results.length + 1} of ${ROUNDS}</small>` : `<span>Today's dive</span> <small>· same prompts for everyone</small>`}</button>
    <button class="btn alt" id="goFree"><span>Free dive</span> <small>· random prompts, play again and again</small></button>
    <div class="statline">
      <div class="stat"><b>${s.played}</b><span>dives</span></div>
      <div class="stat"><b>${fmt(s.best)} m</b><span>deepest</span></div>
      <div class="stat"><b>${s.streak}</b><span>day streak</span></div>
    </div>
    <div class="how">
      <b>How deep each answer takes you</b>
      <div class="tiers">${TIERS.map(t => `<div class="tier" style="border-left:3px solid ${t.color}"><b style="color:${t.color}">${t.name}</b>${t.pts * M_PER_POINT} m</div>`).join("")}</div>
      <div style="margin-top:10px">A wrong guess costs ${WRONG_PENALTY} seconds, so keep trying. Spelling slips and plurals are fine. New daily prompts at midnight.</div>
    </div>`;
  $("goDaily").onclick = () => { Sound.unlock(); startDaily(); };
  $("goFree").onclick = () => { Sound.unlock(); startFree(); };
}

function startDaily() {
  G.mode = "daily"; G.key = todayKey();
  const saved = store.get("daily", {})[G.key];
  G.cats = saved ? saved.cats : dailyCats(G.key);
  G.results = saved ? saved.results : [];
  setMode(" · Today's dive");
  if (saved && saved.done) { G.depth = totalPts() * M_PER_POINT; Sea.target(G.depth, true); showEnd(); return; }
  G.round = G.results.length; G.depth = totalPts() * M_PER_POINT; Sea.target(G.depth, true);
  startRound();
}
function startFree() {
  G.mode = "free"; setMode(" · Free dive");
  const avoid = new Set(store.get("recentFree", []));
  let pool = shuffled(TABLES.length, Math.random).filter(c => !avoid.has(c));
  if (pool.length < ROUNDS) pool = shuffled(TABLES.length, Math.random);
  G.cats = pool.slice(0, ROUNDS); G.results = []; G.round = 0; G.depth = 0; Sea.target(0, true);
  store.set("recentFree", [...G.cats, ...avoid].slice(0, Math.min(35, TABLES.length - ROUNDS)));
  startRound();
}

function dots() { return `<div class="dots">${Array.from({ length: ROUNDS }, (_, i) => {
  const r = G.results[i];
  return `<span class="dot${i === G.round && G.screen === "round" ? " now" : ""}" style="${r ? `background:${r.answer ? TIERS[r.tier].hex : "#334"};border-color:transparent` : ""}"></span>`; }).join("")}</div>`; }

function startRound() {
  G.screen = "round"; $("btnHome").hidden = false;
  const t = TABLES[G.cats[G.round]];
  G.left = ROUND_SECS; G.last = performance.now(); G.paused = false; G.tried = new Set();
  card.innerHTML = `
    <div class="roundhead"><span>Prompt ${G.round + 1} of ${ROUNDS}</span>${dots()}</div>
    <div class="prompt pop">${esc(t.prompt)}</div>
    <div class="timerow"><div class="timer" id="timer"><i id="timerFill"></i></div><span class="secs" id="secs">${ROUND_SECS}</span></div>
    <form class="entry" id="entry" autocomplete="off">
      <input id="guess" type="text" inputmode="text" enterkeyhint="go" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="Type an answer" aria-label="Your answer" maxlength="40">
      <button class="btn" type="submit">Dive</button>
    </form>
    <div class="feedback" id="feedback"></div>`;
  const input = $("guess");
  input.focus({ preventScroll: true });
  $("entry").onsubmit = e => { e.preventDefault(); submit(); };
  input.addEventListener("input", () => Sound.type());
  Sound.prompt();
}

function submit() {
  if (G.screen !== "round") return;
  const input = $("guess"), raw = input.value.trim();
  if (!raw) { input.focus(); return; }
  const t = TABLES[G.cats[G.round]], a = lookup(t, raw), fb = $("feedback");
  if (a) {
    const tier = tierOf(a, t);
    finishRound({ cat: G.cats[G.round], answer: a.name, rank: a.rank, tier, pts: TIERS[tier].pts });
    return;
  }
  const k = norm(raw);
  if (G.tried.has(k)) { fb.textContent = `Already tried “${raw}”.`; }
  else { G.tried.add(k); G.left = Math.max(0, G.left - WRONG_PENALTY); fb.textContent = `“${raw}” isn't on the chart. −${WRONG_PENALTY}s`; }
  fb.className = "feedback";
  const form = $("entry"); form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake");
  input.value = ""; input.focus({ preventScroll: true });
  Sound.wrong(); Sea.wrong();
}

function timeUp() { finishRound({ cat: G.cats[G.round], answer: null, rank: -1, tier: -1, pts: 0 }); }

function finishRound(res) {
  G.results.push(res);
  G.screen = "reveal";
  if (G.mode === "daily") saveDaily();
  if (document.activeElement) document.activeElement.blur();
  G.depth = totalPts() * M_PER_POINT; Sea.target(G.depth);
  const t = TABLES[res.cat], last = G.round >= ROUNDS - 1;
  // A few deep answers they could have found
  const deep = t.answers.filter(a => a.name !== res.answer && tierOf(a, t) >= Math.max(4, res.tier + 1));
  const picks = shuffled(deep.length, Math.random).slice(0, 3).map(i => deep[i].name);
  const common = t.answers.slice(0, 3).map(a => a.name);
  const tier = res.answer ? TIERS[res.tier] : null;
  card.innerHTML = `
    <div class="roundhead"><span>Prompt ${G.round + 1} of ${ROUNDS}</span>${dots()}</div>
    <div class="reveal">
      <div style="color:var(--dim);margin-top:10px;font-weight:700">${esc(t.prompt)}</div>
      ${res.answer ? `
        <div class="ans pop">${esc(res.answer)}</div>
        <div class="tiername pop" style="background:${tier.hex}">${tier.emoji} ${tier.name}</div>
        <div class="gain">+${res.pts * M_PER_POINT} m <span style="color:var(--dim);font-weight:600">· ${tier.note}</span></div>`
      : `<div class="ans pop" style="color:var(--coral)">Out of air!</div>
        <div class="gain" style="color:var(--dim)">No depth gained this time.</div>`}
      <div class="deeper">${res.answer ? "" : `Common answers: <b>${common.map(esc).join(", ")}</b><br>`}${picks.length ? `Deeper down: <b>${picks.map(esc).join(", ")}</b>` : ""}</div>
    </div>
    <button class="btn" id="next">${last ? "Surface and see your dive" : "Next prompt"}</button>`;
  $("next").onclick = () => { Sound.unlock(); if (last) showEnd(true); else { G.round++; startRound(); } };
  $("next").focus({ preventScroll: true });
  if (res.answer) { Sound.ping(res.tier); Sea.burst(res.tier, res.pts * M_PER_POINT); } else { Sound.fail(); Sea.fail(); }
}

function showEnd(fresh) {
  G.screen = "end"; $("btnHome").hidden = true;
  const pts = totalPts(), m = pts * M_PER_POINT;
  if (fresh) recordStats(m);
  const best = G.results.filter(r => r.answer).sort((a, b) => b.tier - a.tier || b.rank - a.rank)[0];
  card.innerHTML = `
    <div class="roundhead"><span>${G.mode === "daily" ? "Today's dive" : "Free dive"}</span>${dots()}</div>
    <div class="big pop">${fmt(m)} m</div>
    <div class="band">${bandOf(m)}</div>
    <ol class="log">${G.results.map(r => {
      const tr = r.answer ? TIERS[r.tier] : null;
      return `<li><span>${tr ? tr.emoji : "⬛"}</span><span>${r.answer ? esc(r.answer) : "<i style='color:var(--dim)'>no answer</i>"}<span class="q">${esc(TABLES[r.cat].prompt)}</span></span><span class="m" style="color:${tr ? tr.hex : "var(--dim)"}">${r.pts * M_PER_POINT} m</span></li>`; }).join("")}</ol>
    ${best && best.tier >= 3 ? `<p style="margin:12px 0 0;text-align:center">Deepest find: <b>${esc(best.answer)}</b></p>` : ""}
    <div class="row2"><button class="btn" id="share">Share</button>${G.mode === "free" ? `<button class="btn alt" id="again">Dive again</button>` : ""}</div>
    <button class="btn alt" id="toHome">Back to the dock</button>`;
  $("share").onclick = share;
  if ($("again")) $("again").onclick = () => { Sound.unlock(); startFree(); };
  $("toHome").onclick = () => { Sound.unlock(); showHome(); };
  if (fresh) Sound.surface(m);
}

function recordStats(m) {
  const s = stats();
  s.played++; s.best = Math.max(s.best, m);
  for (const r of G.results) if (r.answer) s.tiers[r.tier]++;
  if (G.mode === "daily") {
    const prev = s.lastDay;
    s.streak = prev && dayNumber(G.key) - dayNumber(prev) === 1 ? s.streak + 1 : prev === G.key ? s.streak : 1;
    s.maxStreak = Math.max(s.maxStreak, s.streak); s.lastDay = G.key;
  }
  store.set("stats", s);
}

function share() {
  const m = totalPts() * M_PER_POINT;
  const date = G.mode === "daily" ? new Date(G.key + "T12:00").toLocaleDateString("en-US", { month: "short", day: "numeric" }) : "Free dive";
  const text = `Fathom · ${date}\n${G.results.map(r => r.answer ? TIERS[r.tier].emoji : "⬛").join("")}\n${fmt(m)} m · ${bandOf(m)}`;
  if (navigator.share) navigator.share({ text }).catch(() => {});
  else if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast("Copied. Paste it anywhere."), () => toast(text));
  else toast(text);
}
let toastT = 0;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = 0, 2200); }

$("btnHome").onclick = () => {
  if (G.mode === "daily") { if (!confirm("Leave the dive? Today's progress is saved; you'll pick up at this prompt with a fresh timer.")) return; }
  else if (!confirm("Quit this free dive?")) return;
  showHome();
};

// ---------- Timer ----------
function tick(now) {
  if (G.screen === "round") {
    const dt = Math.min(.25, (now - G.last) / 1000);
    if (!G.paused) G.left -= dt;
    const left = Math.max(0, G.left), fill = $("timerFill"), secs = $("secs");
    if (fill) { fill.style.transform = `scaleX(${left / ROUND_SECS})`; $("timer").classList.toggle("low", left <= 5); }
    if (secs) { const s = Math.ceil(left); if (secs.textContent != s) { secs.textContent = s; if (s <= 5 && s > 0) Sound.tick(); } }
    if (G.left <= 0) timeUp();
  }
  G.last = now;
}
document.addEventListener("visibilitychange", () => { G.paused = document.visibilityState !== "visible"; });

// ---------- The sea ----------
// The sub stays put on screen while the world scrolls past it: things sit at fixed depths (landmarks) and slide up as
// the sub sinks. K = pixels per metre, the same scale the depth gauge uses.
const Sea = (() => {
  const cv = $("sea"), cx = cv.getContext("2d");

  const snow = [], bubbles = [], life = [], sparks = [], rings = [], floats = [], streaks = [];
  const mood = { kind: "", until: 0 };          // the cats' faces: "", "cheer", "oops", "gasp"
  function resize() {
    dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    snow.length = 0;
    for (let i = 0; i < Math.round(W * H / 9000); i++) snow.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.6 + .4, s: Math.random() * .4 + .2 });
  }
  addEventListener("resize", resize); resize();
  const wide = () => W >= 900 && W > H;
  const K = () => wide() ? .9 : .7;
  const subPos = () => wide() ? { x: W * .7, y: H * .52 } : { x: W * .5, y: H * .74 };
  const wy = m => subPos().y + (m - shown) * K();                 // screen y of a depth
  const near = (m, span = 700) => Math.abs(m - shown) < span / K() * 1.1;
  // x positions: on wide screens the card covers the left half, so landmarks use the right half
  const X = (fw, fn) => (wide() ? fw : fn) * W;
  const STOPS = [[0, [38, 140, 200]], [300, [18, 84, 150]], [800, [10, 44, 98]], [1500, [5, 20, 52]], [2200, [3, 9, 26]], [2900, [1, 3, 10]]];
  function water(m) {
    m = Math.max(0, m);
    for (let i = 1; i < STOPS.length; i++) if (m <= STOPS[i][0] || i === STOPS.length - 1) {
      const [m0, c0] = STOPS[i - 1], [m1, c1] = STOPS[i], f = Math.min(1, (m - m0) / (m1 - m0));
      return c0.map((v, k) => Math.round(v + (c1[k] - v) * f));
    }
  }
  const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  const glow = (x, y, r, color) => { const g = cx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, color); g.addColorStop(1, "rgba(0,0,0,0)"); cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, r, 0, 7); cx.fill(); };

  // ---- Landmarks, from the surface down ----
  function surface() {
    const y = wy(0); if (y < -40) return;
    // sky
    const g = cx.createLinearGradient(0, 0, 0, y); g.addColorStop(0, "#7cc8f2"); g.addColorStop(1, "#d6f1ff");
    cx.fillStyle = g; cx.fillRect(0, 0, W, y);
    glow(X(.86, .82), y - 120, 70, "rgba(255,240,170,.9)");
    cx.fillStyle = "#fff6c8"; cx.beginPath(); cx.arc(X(.86, .82), y - 120, 26, 0, 7); cx.fill();
    cx.fillStyle = "rgba(255,255,255,.9)";
    for (let i = 0; i < 4; i++) { const cxx = ((i * 260 + t * 12) % (W + 300)) - 150, cy = y - 170 + (i % 2) * 50;
      for (const [dx, dy, r] of [[0, 0, 18], [20, -8, 22], [42, 0, 16]]) { cx.beginPath(); cx.arc(cxx + dx, cy + dy, r, 0, 7); cx.fill(); } }
    // gulls
    cx.strokeStyle = "rgba(40,60,80,.7)"; cx.lineWidth = 2;
    for (let i = 0; i < 3; i++) { const gx = ((i * 330 + t * 40) % (W + 100)) - 50, gy = y - 90 - i * 25 + Math.sin(t * 2 + i) * 6, f = Math.sin(t * 6 + i) * 4;
      cx.beginPath(); cx.moveTo(gx - 9, gy - f); cx.quadraticCurveTo(gx - 4, gy - 6, gx, gy); cx.quadraticCurveTo(gx + 4, gy - 6, gx + 9, gy - f); cx.stroke(); }
    // a red and white buoy bobbing
    const bx = X(.56, .2), by = y + Math.sin(t * 1.6) * 4;
    cx.fillStyle = "#e5483b"; cx.beginPath(); cx.moveTo(bx - 10, by + 6); cx.lineTo(bx - 6, by - 26); cx.lineTo(bx + 6, by - 26); cx.lineTo(bx + 10, by + 6); cx.fill();
    cx.fillStyle = "#fff"; cx.fillRect(bx - 8, by - 14, 16, 7);
    if (Math.sin(t * 3) > 0) glow(bx, by - 30, 12, "rgba(255,230,120,.9)");
    // waves
    cx.fillStyle = "rgba(220,245,255,.5)";
    cx.beginPath(); cx.moveTo(0, y);
    for (let x = 0; x <= W + 20; x += 20) cx.lineTo(x, y + Math.sin(x * .03 + t * 2) * 4);
    cx.lineTo(W, y + 10); cx.lineTo(0, y + 10); cx.fill();
  }
  function ledge() {
    // a rocky ledge with a kelp forest growing up from it, and a sunken carnival (Scareisdale) on top
    if (!near(200, 900)) return;
    const base = wy(260), x0 = X(.5, .0), x1 = W;
    cx.fillStyle = "rgba(8,30,55,.95)";
    cx.beginPath(); cx.moveTo(x0 - 10, base + 30);
    for (let i = 0; i <= 12; i++) { const x = x0 + (x1 - x0) * i / 12; cx.lineTo(x, base + Math.sin(i * 1.7) * 16 - (i > 7 ? 20 : 0)); }
    cx.lineTo(x1 + 10, base + 260);
    for (let i = 12; i >= 0; i--) { const x = x0 + (x1 - x0) * i / 12; cx.lineTo(x, base + 40 + i * 16 + Math.sin(i * 2.9) * 14); }
    cx.fill();
    cx.fillStyle = "rgba(255,255,255,.05)";
    for (let i = 0; i < 7; i++) { cx.beginPath(); cx.ellipse(x0 + 40 + i * (x1 - x0) / 7, base + 30 + i * 12, 22, 8, .2, 0, 7); cx.fill(); }
    // kelp
    for (let i = 0; i < 9; i++) {
      const kx = x0 + 20 + i * (x1 - x0 - 40) / 8 + Math.sin(i * 7) * 14, top = wy(40 + (i * 37) % 90);
      cx.strokeStyle = i % 2 ? "rgba(90,150,70,.75)" : "rgba(120,170,60,.7)"; cx.lineWidth = 7; cx.lineCap = "round";
      cx.beginPath(); cx.moveTo(kx, base);
      for (let y = base; y > top; y -= 20) cx.lineTo(kx + Math.sin(t * 1.2 + y * .02 + i) * (10 + (base - y) * .03), y);
      cx.stroke();
      cx.fillStyle = "rgba(140,190,80,.6)";
      for (let y = base - 30; y > top; y -= 46) { const sx = kx + Math.sin(t * 1.2 + y * .02 + i) * (10 + (base - y) * .03);
        cx.beginPath(); cx.ellipse(sx + 8, y, 10, 4, .5 + Math.sin(t + y) * .2, 0, 7); cx.fill(); }
    }
    // the carnival: a ferris wheel turning slowly, a striped tent and a glowing pumpkin
    const fx = X(.88, .78), fy = base - 120, R = wide() ? 80 : 62, a0 = t * .25;
    cx.strokeStyle = "rgba(255,190,120,.6)"; cx.lineWidth = 4;
    cx.beginPath(); cx.moveTo(fx - R * .6, base - 6); cx.lineTo(fx, fy); cx.lineTo(fx + R * .6, base - 6); cx.stroke();
    cx.lineWidth = 3; cx.beginPath(); cx.arc(fx, fy, R, 0, 7); cx.stroke();
    for (let i = 0; i < 8; i++) {
      const a = a0 + i * Math.PI / 4, px = fx + Math.cos(a) * R, py = fy + Math.sin(a) * R;
      cx.strokeStyle = "rgba(255,190,120,.4)"; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(fx, fy); cx.lineTo(px, py); cx.stroke();
      cx.fillStyle = i % 2 ? "rgba(255,111,181,.8)" : "rgba(127,227,255,.8)"; cx.fillRect(px - 7, py, 14, 11);
      if ((i + Math.floor(t * 2)) % 3 === 0) glow(px, py, 9, "rgba(255,220,140,.9)");
    }
    const tx = X(.6, .2), ty = base - 4;
    for (let i = 0; i < 6; i++) { cx.fillStyle = i % 2 ? "rgba(240,90,80,.85)" : "rgba(250,240,220,.85)";
      cx.beginPath(); cx.moveTo(tx, ty - 70); cx.lineTo(tx - 50 + i * 16.6, ty); cx.lineTo(tx - 50 + (i + 1) * 16.6, ty); cx.fill(); }
    pumpkin(tx + 70, base - 16, 16);
  }
  function pumpkin(x, y, r) {
    glow(x, y, r * 3, `rgba(255,140,40,${.35 + Math.sin(t * 4) * .1})`);
    cx.fillStyle = "#f08a24";
    for (const dx of [-r * .5, 0, r * .5]) { cx.beginPath(); cx.ellipse(x + dx, y, r * .6, r * .8, 0, 0, 7); cx.fill(); }
    cx.fillStyle = "#4a7a2a"; cx.fillRect(x - 2, y - r - 4, 4, 6);
    cx.fillStyle = "#ffe27a";
    cx.beginPath(); cx.moveTo(x - r * .55, y - r * .15); cx.lineTo(x - r * .2, y - r * .35); cx.lineTo(x - r * .25, y); cx.fill();
    cx.beginPath(); cx.moveTo(x + r * .55, y - r * .15); cx.lineTo(x + r * .2, y - r * .35); cx.lineTo(x + r * .25, y); cx.fill();
    cx.beginPath(); cx.moveTo(x - r * .5, y + r * .25); for (let i = 0; i <= 6; i++) cx.lineTo(x - r * .5 + i * r / 6, y + r * (i % 2 ? .35 : .5)); cx.lineTo(x + r * .4, y + r * .25); cx.fill();
  }
  function shipwreck() {

    const y = wy(560), x = X(.86, .62);
    cx.fillStyle = "rgba(60,90,110,.55)"; cx.beginPath(); cx.ellipse(x + 60, y + 30, 230, 40, 0, Math.PI, 0); cx.fill();
    cx.save(); cx.translate(x, y); cx.rotate(-.18);
    cx.fillStyle = "#4a3426"; cx.strokeStyle = "#2a1c12"; cx.lineWidth = 3;
    cx.beginPath(); cx.moveTo(-120, -30); cx.lineTo(120, -40); cx.lineTo(90, 20); cx.lineTo(-90, 26); cx.closePath(); cx.fill(); cx.stroke();
    cx.strokeStyle = "rgba(30,20,12,.8)"; cx.lineWidth = 2; for (let i = 0; i < 4; i++) { cx.beginPath(); cx.moveTo(-110 + i * 6, -16 + i * 10); cx.lineTo(108 - i * 6, -26 + i * 10); cx.stroke(); }
    cx.strokeStyle = "#3a2a1e"; cx.lineWidth = 6; cx.beginPath(); cx.moveTo(-10, -34); cx.lineTo(-30, -150); cx.stroke();
    cx.fillStyle = "rgba(220,210,180,.35)"; cx.beginPath(); cx.moveTo(-28, -140); cx.quadraticCurveTo(10, -110 + Math.sin(t) * 6, -22, -70); cx.fill();
    for (const px of [-70, -20, 30, 80]) { cx.fillStyle = "#1a2a3a"; cx.beginPath(); cx.arc(px, -12, 6, 0, 7); cx.fill(); }
    cx.restore();
    // treasure glinting in the sand
    const gx = x + 140, gy = y + 18;
    cx.fillStyle = "#7a4d1c"; cx.fillRect(gx - 16, gy - 12, 32, 18); cx.fillStyle = "#ffd166"; cx.fillRect(gx - 16, gy - 4, 32, 3);

        const bx = (i / 6) * W * 1.3 - W * .1 + Math.sin(t * .3 + i) * 30, a = sun * (.06 + .03 * Math.sin(t * .7 + i * 2));
        const bg = cx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, `rgba(200,240,255,${a})`); bg.addColorStop(1, "rgba(200,240,255,0)");
        cx.fillStyle = bg; cx.beginPath(); cx.moveTo(bx, Math.max(0, wy(0))); cx.lineTo(bx + 60, Math.max(0, wy(0))); cx.lineTo(bx + 160, H); cx.lineTo(bx + 20, H); cx.fill();
      }

    cx.fillStyle = `rgba(220,235,255,${.25 + Math.min(.35, shown / 3000)})`;
    for (const s of snow) {
      s.y -= (s.s * 12 + vel * K() * s.s) * dt; s.x += Math.sin(t + s.r * 9) * .1;
      if (s.y < -4) { s.y = H + 4; s.x = Math.random() * W; } if (s.y > H + 4) { s.y = -4; s.x = Math.random() * W; }
      if (s.y < wy(0)) continue;
      cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 7); cx.fill();
    }
    surface(); ledge(); shipwreck(); flipBoard(); whale(); ghost(); giantSquid(); vents(); trench();
    if (now - lastLife > (shown < 350 ? 2200 : 3200) && life.length < 5) { spawnLife(); lastLife = now; }
    for (let i = life.length - 1; i >= 0; i--) {
      const L = life[i]; L.x += L.dir * L.sp * 60 * dt; L.y -= vel * K() * .9 * dt + Math.sin(t + L.ph) * .15;
      if (L.x < -160 || L.x > W + 160 || L.y < -120 || L.y > H + 120) { life.splice(i, 1); continue; }
      if (L.y > wy(0) + 10) drawLife(L);
    }
    // speed streaks while diving
    const fast = Math.min(1, Math.max(0, (vel - 40) / 200));
    if (fast > 0 && Math.random() < fast) streaks.push({ x: Math.random() * W, y: H + 20, len: 40 + Math.random() * 90 });
    cx.strokeStyle = `rgba(200,235,255,${.35 * fast})`; cx.lineWidth = 1.5;
    for (let i = streaks.length - 1; i >= 0; i--) { const s = streaks[i]; s.y -= (300 + vel * 2) * dt;
      if (s.y + s.len < 0 || fast === 0) { streaks.splice(i, 1); continue; }
      cx.beginPath(); cx.moveTo(s.x, s.y); cx.lineTo(s.x, s.y + s.len); cx.stroke(); }
    const p = subPos(), S = wide() ? 1.7 : 1.3;
    if (Math.random() < .25 + Math.min(.7, Math.abs(vel) / 300)) bubbles.push({ x: p.x - 64 * S, y: p.y + (Math.random() - .5) * 10, r: Math.random() * 3 + 1.5, v: Math.random() * 30 + 30 });
    cx.strokeStyle = "rgba(220,240,255,.55)"; cx.lineWidth = 1.2;
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i]; b.y -= (b.v + vel * K()) * dt; b.x += Math.sin(t * 3 + b.r) * .4 - 10 * dt; b.r += dt * .6;
      if (b.y < -10 || b.r > 9) { bubbles.splice(i, 1); continue; }
      cx.beginPath(); cx.arc(b.x, b.y, b.r, 0, 7); cx.stroke();
    }
    drawSub(p);
    // sonar rings and sparkles from a find
    for (let i = rings.length - 1; i >= 0; i--) { const r = rings[i]; r.r += dt * 260; r.a -= dt * .7;
      if (r.a <= 0) { rings.splice(i, 1); continue; }
      cx.strokeStyle = r.c.replace("A", r.a.toFixed(3)); cx.lineWidth = 3; cx.beginPath(); cx.arc(p.x, p.y, r.r, 0, 7); cx.stroke(); }
    cx.save(); cx.globalCompositeOperation = "lighter";
    for (let i = sparks.length - 1; i >= 0; i--) { const s = sparks[i]; s.x += s.vx * dt; s.y += s.vy * dt - vel * K() * dt; s.vx *= .97; s.vy *= .97; s.life -= dt;

    cx.restore();
    for (let i = floats.length - 1; i >= 0; i--) { const f = floats[i]; f.y -= dt * 40; f.a -= dt * .5;
      if (f.a <= 0) { floats.splice(i, 1); continue; }
      cx.globalAlpha = Math.min(1, f.a); cx.font = `400 ${wide() ? 34 : 26}px Righteous, system-ui`; cx.textAlign = "center";
      cx.fillStyle = f.c; cx.fillText(f.text, p.x, p.y - 70 - (1.6 - f.a) * 40); cx.globalAlpha = 1; }
    const v = cx.createRadialGradient(p.x, p.y, 60, p.x, p.y, Math.max(W, H) * (1 - Math.min(.45, shown / 5000)));
    v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, `rgba(0,0,0,${.2 + Math.min(.5, shown / 4000)})`);

  return {
    target(m, jump) { goal = m; if (jump) shown = m; Sound.depth(m); },
    // a find: sonar rings in the tier's colour, sparkles, the cats cheer, and a big splash for the rarest
    burst(tier, metres) {
      const p = subPos(), c = hexA(TIERS[tier].hex);
      for (let i = 0; i <= Math.min(3, tier); i++) rings.push({ r: 30 + i * 30, a: 1 - i * .15, c });
      for (let i = 0; i < 24 + tier * 14; i++) { const a = Math.random() * 7, s = 60 + Math.random() * (140 + tier * 40);
        sparks.push({ x: p.x, y: p.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1 + Math.random() * .8, size: 2 + Math.random() * 2.5, c }); }
      for (let i = 0; i < 20 + tier * 8; i++) bubbles.push({ x: p.x + (Math.random() - .5) * 120, y: p.y + (Math.random() - .5) * 60, r: Math.random() * 4 + 2, v: Math.random() * 80 + 60 });
      floats.push({ text: "+" + fmt(metres) + " m", a: 1.6, y: 0, c: TIERS[tier].hex });
      mood.kind = "cheer"; mood.until = t + 2.4;
      if (tier >= 4) shake = 1.2;
    },
    wrong() { shake = .5; mood.kind = "oops"; mood.until = t + 1.2; },
    fail() { shake = .8; mood.kind = "gasp"; mood.until = t + 2.2;
      for (let i = 0; i < 30; i++) { const p = subPos(); bubbles.push({ x: p.x + (Math.random() - .5) * 80, y: p.y + (Math.random() - .5) * 40, r: Math.random() * 3 + 1, v: Math.random() * 120 + 40 }); } },
    get shown() { return shown; },
  };
})();

// ---------- Sound: synthesized effects and a slow underwater pad ----------
const Sound = (() => {
  let ac = null, master = null, sfx = null, mus = null, keepAlive = null, musicTimer = null, nextBeat = 0, step = 0, depthM = 0;
  let mode = store.get("sound", "all");      // all | sfx | off
  function iosUnlock() {
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
    if (!keepAlive) {
      // older iOS: a looping silent <audio> track puts the page in the playback category so the Silent switch doesn't mute it
      const rate = 8000, n = rate / 2, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
      const w = (o, str) => [...str].forEach((ch, i) => v.setUint8(o + i, ch.charCodeAt(0)));
      w(0, "RIFF"); v.setUint32(4, 36 + n, true); w(8, "WAVEfmt "); v.setUint32(16, 16, true);
      v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate, true);
      v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, "data"); v.setUint32(40, n, true);
      for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
      keepAlive = new Audio(URL.createObjectURL(new Blob([buf], { type: "audio/wav" })));
      keepAlive.loop = true; keepAlive.setAttribute("playsinline", "");
    }
    keepAlive.play().catch(() => {});
    const b = ac.createBufferSource(); b.buffer = ac.createBuffer(1, 1, 22050); b.connect(ac.destination); b.start(0);
  }
  function unlock() {
    if (mode === "off") return;
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
      const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3; comp.connect(ac.destination);
      master = ac.createGain(); master.gain.value = .9; master.connect(comp);
      sfx = ac.createGain(); sfx.gain.value = .8; sfx.connect(master);
      const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1400; lp.connect(master);
      mus = ac.createGain(); mus.gain.value = 0; mus.connect(lp);
      iosUnlock();
    }
    if (ac.state !== "running") ac.resume().catch(() => {});
    applyMode();
  }
  function applyMode() {
    const b = $("btnSound");
    b.textContent = mode === "all" ? "♪ On" : mode === "sfx" ? "♪ Fx only" : "♪ Off";
    b.setAttribute("aria-label", "Sound: " + (mode === "all" ? "music and effects" : mode === "sfx" ? "effects only" : "off"));
    if (!ac) return;
    const now = ac.currentTime;
    mus.gain.cancelScheduledValues(now); mus.gain.setTargetAtTime(mode === "all" ? .3 : 0, now, .4);
    sfx.gain.setTargetAtTime(mode === "off" ? 0 : .8, now, .05);
    if (mode === "all" && !musicTimer) { nextBeat = ac.currentTime + .2; musicTimer = setInterval(schedule, 250); schedule(); }
    if (mode !== "all" && musicTimer) { clearInterval(musicTimer); musicTimer = null; }
    if (mode === "off" && keepAlive) keepAlive.pause();
    else if (keepAlive && keepAlive.paused) keepAlive.play().catch(() => {});
  }
  function cycle() { mode = mode === "all" ? "sfx" : mode === "sfx" ? "off" : "all"; store.set("sound", mode); if (mode !== "off") unlock(); applyMode(); }
  const ok = () => ac && mode !== "off" && ac.state === "running";
  function tone(freq, dur, { type = "sine", vol = .3, at = 0, to = null, attack = .005, dest = null } = {}) {
    const t0 = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0); if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + attack); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g); g.connect(dest || sfx); o.start(t0); o.stop(t0 + dur + .05);
  }
  function echo(freq, dur, opts = {}) { tone(freq, dur, opts); tone(freq, dur, { ...opts, vol: (opts.vol || .3) * .35, at: (opts.at || 0) + .32 }); tone(freq, dur, { ...opts, vol: (opts.vol || .3) * .14, at: (opts.at || 0) + .64 }); }
  // Music: a slow pad in D minor pentatonic with sonar-like bell notes; it gets lower and sparser the deeper you go
  const SCALE = [0, 3, 5, 7, 10, 12, 15];
  function schedule() {
    if (!ac || mode !== "all") return;
    const beat = 60 / (68 - Math.min(20, depthM / 140));
    while (nextBeat < ac.currentTime + .6) {
      const root = 146.83 * Math.pow(2, -Math.min(1, depthM / 2800));   // D3 sinking toward D2
      if (step % 8 === 0) {
        const chord = [0, 7, 10, 15][(step / 8) % 4 | 0] ?? 0;
        for (const iv of [0, 7, 12]) tone(root / 2 * Math.pow(2, (iv + chord % 12) / 12), beat * 8.5, { type: "triangle", vol: .07, at: nextBeat - ac.currentTime, attack: beat * 2, dest: mus });
      }
      if (Math.random() < .32 - Math.min(.18, depthM / 9000)) {
        const n = SCALE[Math.floor(Math.random() * SCALE.length)];

    unlock, cycle, applyMode,
    depth(m) { depthM = m; },
    type() { if (ok()) tone(900 + Math.random() * 500, .05, { type: "sine", vol: .04, to: 1600 }); },
    prompt() { if (ok()) { tone(520, .12, { vol: .12 }); tone(780, .2, { vol: .1, at: .08 }); } },
    tick() { if (ok()) tone(1200, .06, { type: "square", vol: .05 }); },
    wrong() { if (ok()) { tone(180, .22, { type: "sawtooth", vol: .1, to: 120 }); tone(160, .25, { type: "square", vol: .05, at: .05, to: 110 }); } },
    ping(tier) {
      if (!ok()) return;
      // a sonar ping, lower and longer for deeper finds, with a little sparkle for the rarest
      const f = [1320, 1175, 990, 880, 740, 587][tier];
      echo(f, .9 + tier * .15, { vol: .22, attack: .004 });
      tone(f / 4, .7, { type: "sine", vol: .2, to: f / 6 });

      for (let i = 0; i < 6 + tier * 2; i++) tone(400 + Math.random() * 900, .06, { vol: .05, at: .1 + i * .07, to: 1400 + Math.random() * 800 });
      if (tier >= 4) [0, 4, 7, 12, 16].forEach((s, i) => tone(f * Math.pow(2, s / 12), .5, { type: "triangle", vol: .08, at: .45 + i * .09 }));
    },
    fail() { if (ok()) { tone(300, .5, { type: "triangle", vol: .15, to: 140 }); for (let i = 0; i < 10; i++) tone(300 + Math.random() * 500, .05, { vol: .04, at: i * .05, to: 900 }); } },
    surface(m) {
      if (!ok()) return;

})();
$("btnSound").onclick = () => Sound.cycle();
Sound.applyMode();

// Pick up a newer version: whenever the game opens or comes back on screen, ask the site for the latest page and
// reload if its version is different (not in the middle of a prompt). Dives are saved on the device.
async function checkForUpdate() {
  if (!location.pathname.includes("/fathom/") || !navigator.onLine) return;
  try {
    const res = await fetch(location.pathname, { cache: "no-cache" });
    const m = res.ok && (await res.text()).match(/const VERSION = "([^"]+)"/);
    if (!m || m[1] === VERSION || sessionStorage.getItem(KEY + "tried") === m[1]) return;
    if (G.screen === "round" || G.screen === "reveal") return;
    sessionStorage.setItem(KEY + "tried", m[1]);
    location.reload();
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkForUpdate(); });
setTimeout(checkForUpdate, 1500);

showHome();
window.__fathom = { G, Sea, TABLES, lookup, tierOf, dailyCats, startDaily, startFree, submit, timeUp, showHome, norm };   // used by the automated tests
})();
