# Makes Fathom's daily dives: fathom/daily/YYYY-MM-DD.json for yesterday (UTC) through 7 days ahead, each with its
# seven prompts and all their answers, so every player gets the same dive. Runs every day; a day's file is never
# changed once made. Editing the script re-checks every Wikidata category (fathom/daily/check.txt); put
# [make days] in that commit's message to also make the days right away.
name: Fathom daily dives
on:
  schedule:
    - cron: "41 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/fathom_daily.py"]
permissions:
  contents: write
concurrency: fathom-daily
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Test the connection to Wikidata
        if: github.event_name == 'push'
        run: |
          mkdir -p fathom/daily
          { date -u; curl -sS -o /dev/null -w "ASK: http %{http_code} in %{time_total}s\n" --max-time 30 -A "FathomDaily/1.0 (https://voodoovid.github.io/fathom/)" \
              --data-urlencode "query=ASK {}" -H "Accept: application/sparql-results+json" https://query.wikidata.org/sparql 2>&1; } > fathom/daily/diag.txt || true
          cat fathom/daily/diag.txt
      - name: Check every category
        if: github.event_name == 'push'
        run: python3 .github/scripts/fathom_daily.py --check
        timeout-minutes: 35
        continue-on-error: true
      - name: Make missing days
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[make days]')
        run: python3 .github/scripts/fathom_daily.py
      - name: Save if changed
        if: always()
        run: |
          mkdir -p fathom/daily
          git add -A fathom/daily
          git diff --cached --quiet && exit 0
          git -c user.name="fathom-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Fathom daily dives"
          git pull --rebase -q
          git push
