# Temporary: times variants of the Fathom Wikidata query (delete once Fathom's daily run works).
name: Fathom probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fathom_probe.py
      - run: |
          git add fathom/daily/probe.txt
          git -c user.name="fathom-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Fathom probe results"
          git pull --rebase -q
          git push
        if: always()
