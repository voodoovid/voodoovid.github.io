<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Secrets Check</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07090c">
<style>
/* Test Chambers Secrets Check (v8.35, Batch I; v1.1 for v8.36: rooms 39 to 53 rebuilt, notes shown for secrets kept as built): green/red checks of every camera and every secret (dens, hidden corners, seams).
   It runs the game's own secretAudit() in a hidden frame, so it checks exactly what the game builds. Everything starts below the status bar. */
:root { color-scheme: dark; --bg: #07090c; --panel: #0e1318; --line: rgba(255,255,255,.08); --ink: #eef2f5; --dim: rgba(238,242,245,.58);
  --blue: #2fa4ff; --orange: #ff9d2e; --pass: #2fd47a; --fail: #ff4d5e; --warn: #f4b942; --run: #7fb6ff;
  --font: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-text-size-adjust: 100%; }
body { overflow: hidden; }
#page { position: fixed; inset: 0; display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) calc(env(safe-area-inset-right, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 12px) calc(env(safe-area-inset-left, 0px) + 16px); }
header { display: flex; align-items: center; gap: 14px; padding: 4px 2px 12px; border-bottom: 1px solid var(--line); flex: none; flex-wrap: wrap; }
.logo { width: 34px; height: 34px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 50%, var(--blue) 0 34%, transparent 35%), radial-gradient(circle at 65% 50%, var(--orange) 0 34%, transparent 35%), #111820;
  box-shadow: 0 0 0 1px rgba(255,255,255,.12) inset; }
.title b { display: block; font-size: 11px; letter-spacing: .26em; color: var(--dim); font-weight: 700; }
.title span { display: block; font-size: 20px; font-weight: 700; letter-spacing: .05em; }
#summary { margin-left: auto; text-align: right; font-size: 13px; color: var(--dim); line-height: 1.35; }
#summary strong { display: block; font-size: 15px; color: var(--ink); letter-spacing: .02em; }
.pill { flex: none; border: 0; border-radius: 22px; padding: 11px 18px; font: 700 15px/1 var(--font); letter-spacing: .04em; color: #071018;
  background: linear-gradient(180deg, #59baff, #2b8fe0); cursor: pointer; box-shadow: 0 6px 18px rgba(47,164,255,.25); }
.pill.ghost { background: rgba(255,255,255,.07); color: var(--ink); box-shadow: none; border: 1px solid rgba(255,255,255,.16); padding: 10px 14px; text-decoration: none; }
.pill:disabled { opacity: .45; cursor: default; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 0.9fr) 1.3fr; gap: 16px; padding-top: 14px; }
@media (max-width: 760px) { main { grid-template-columns: 1fr; overflow-y: auto; -webkit-overflow-scrolling: touch; } .col { overflow: visible !important; } }
.col { overflow-y: auto; -webkit-overflow-scrolling: touch; padding-right: 4px; min-height: 0; }
h4 { margin: 4px 2px 8px; font-size: 11px; letter-spacing: .22em; color: var(--dim); font-weight: 800; }
.row { display: grid; grid-template-columns: 74px 1fr; gap: 12px; align-items: start; padding: 10px 12px; margin-bottom: 7px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.chip { font: 800 11px/1 var(--font); letter-spacing: .12em; text-align: center; padding: 7px 0; border-radius: 6px; margin-top: 1px; background: rgba(255,255,255,.06); color: var(--dim); }
.row[data-s="run"] .chip { background: rgba(127,182,255,.14); color: var(--run); }
.row[data-s="pass"] .chip { background: rgba(47,212,122,.16); color: var(--pass); }
.row[data-s="fail"] .chip { background: rgba(255,77,94,.16); color: var(--fail); }
.row[data-s="pass"] { border-color: rgba(47,212,122,.28); }
.row[data-s="fail"] { border-color: rgba(255,77,94,.35); }
.row[data-s="old"] .chip { background: rgba(244,185,66,.16); color: var(--warn); }
.row[data-s="old"] { border-color: rgba(244,185,66,.3); }
.tag { display: inline-block; font: 700 10.5px/1 var(--font); letter-spacing: .06em; padding: 4px 6px; border-radius: 5px; margin: 4px 4px 0 0; background: rgba(255,255,255,.06); color: var(--ink); }
.tag.cam { background: rgba(47,164,255,.12); color: #9fd2ff; } .tag.sec { background: rgba(255,157,46,.13); color: #ffc58a; } .tag.old { background: rgba(244,185,66,.13); color: var(--warn); } .tag.none { color: var(--dim); }
.row h3 { margin: 0; font-size: 14.5px; font-weight: 700; }
.row p { margin: 3px 0 0; font-size: 12.5px; color: var(--dim); line-height: 1.4; }
.row .det { color: var(--ink); opacity: .86; }
.row .bad { color: var(--fail); opacity: 1; }
.row small { color: var(--dim); font-weight: 600; letter-spacing: .04em; }
#ver { position: fixed; right: calc(env(safe-area-inset-right, 0px) + 12px); bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); font-size: 11px; color: var(--dim); letter-spacing: .08em; pointer-events: none; }
#tip { position: fixed; z-index: 9; max-width: 260px; padding: 7px 10px; border-radius: 8px; background: #1b232c; border: 1px solid rgba(255,255,255,.16); font-size: 12.5px; line-height: 1.35; pointer-events: none; box-shadow: 0 8px 22px rgba(0,0,0,.5); }
iframe { position: fixed; left: -9999px; top: 0; width: 640px; height: 400px; border: 0; visibility: hidden; }
</style>
</head>
<body>
<div id="page">
  <header>
    <div class="logo"></div>
    <div class="title"><b>TEST CHAMBERS</b><span>Secrets Check</span></div>
    <div id="summary"><strong id="sumHead">Starting</strong><span id="sumText">Loading the game in the background.</span></div>
    <button class="pill" id="bRun" data-tip="Build every room again and repeat all the checks." disabled>Run again</button>
    <a class="pill ghost" id="bMode" href="?test" data-tip="Check the Secrets Test room (every new piece in one room) instead of the game's rooms.">Test room</a>
    <a class="pill ghost" href="dencheck.html" data-tip="The den furniture checks (Den Check).">Den Check</a>
    <a class="pill ghost" id="bGame" href="./" data-tip="Back to Test Chambers.">Game</a>
  </header>
  <main>
    <div class="col"><h4>CHECKS</h4><div id="checks"></div></div>
    <div class="col"><h4 id="roomsHead">ROOMS, ONE BY ONE</h4><div id="rooms"></div></div>
  </main>
</div>
<div id="ver"></div>
<div id="tip" hidden></div>
<script>
const VERSION = "v1.1", TEST = /[?&]test\b/.test(location.search);
const $ = id => document.getElementById(id), esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
$("ver").textContent = "Secrets Check " + VERSION;
if (TEST) { $("bMode").textContent = "Game rooms"; $("bMode").href = "secrets.html"; $("bMode").dataset.tip = "Check the game's 54 rooms."; $("bGame").href = "./?secretstest"; $("bGame").textContent = "Play test room"; $("bGame").dataset.tip = "Play the Secrets Test room."; $("roomsHead").textContent = "THE TEST ROOM"; }
// [id, title, what it proves, a pattern over each room's problems, or a global check id]
const CHECKS = [
  ["build", "Every room builds", "Each room and its cameras are built with no error.", /failed to build|^camera: /],
  ["mount", "Every camera is on something", "Each camera is fixed to a real wall, pillar, pipe, window sill or ceiling.", /not on a surface/],
  ["head", "Camera heads are clear", "No camera head is inside or touching a wall.", /its head is inside|its head touches/],
  ["reach", "Out of reach", "Every camera head is at least 2.2 m above the floor under it.", /in reach from the floor/],
  ["looks", "Every camera watches something", "Each one can see what it is there to watch: the way in, the door, the plate.", /cannot see what it watches/],
  ["clear", "Clear of signs and windows", "No camera sits on a sign or across an office window (except one mounted under its sill).", /on top of a sign|on an office window|no window over it/],
  ["pipe", "Pipes only backstage", "The pipe mount is used only in the backstage rooms (39 to 51).", /pipe mount outside/],
  ["row", "No two rooms in a row alike", "No room uses the same camera mount on the same wall as the room before it (watching cameras and camera-scale weights are puzzle pieces and do not count).", /same mount and wall/],
  ["none", "About 12 rooms with none", "Between 10 and 14 rooms have no camera at all.", "none"],
  ["mounts", "All eight mounts used", "Corner, over the exit, over the way in, drop pole, pillar, window, low over a doorway, pipe.", "mounts"],
  ["way", "Backstage: a camera on the way in", "In every backstage room a camera sees you where you come in, so SaDos can speak (Out Of Order is silent on purpose).", /no camera sees the way in/],
  ["watch", "Puzzle cameras where they belong", "Watching cameras are where the plan left them, and every camera a camera scale needs can be knocked down by a portal.", /watching camera|camera-scale room/],
  ["hidden", "Secrets hidden from the route", "No den or hidden corner (its opening or its find) can be seen from where a solver stands, or from the straight line from the start to the exit.", /seen from the route/],
  ["found", "Every secret can be found", "Each one is seen from at least one spot off the route (for a covered one, its cover: the crooked panel, the grate).", /discovery spot/],
  ["holds", "Every secret holds something", "Each den and corner has at least one find you can take without key cards.", /holds nothing/],
  ["ways", "Ways in stay fresh", "No way in is used more than three times in the game; weighted-plate dens two at most.", "ways"],
  ["seam", "Seams add nothing", "Observation windows and other seams add no white surface and nothing in reach.", /adds a white|in reach \(/],
  ["nothing", "Nine rooms with nothing", "Rooms 1, 5, 6, 9, 11, 17, 22, 32 and 53 have no den, corner or seam.", /one of the nine with nothing/]
];
function row(host, id, title, text) { const d = document.createElement("div"); d.className = "row"; d.id = id; d.dataset.s = "run"; d.innerHTML = '<div class="chip">...</div><div><h3>' + title + '</h3><p>' + text + '</p><p class="det"></p></div>'; host.appendChild(d); return d; }
function set(d, st, det) { d.dataset.s = st === true ? "pass" : st === false ? "fail" : st; d.querySelector(".chip").textContent = st === true ? "PASS" : st === false ? "FAIL" : st === "old" ? "LATER" : "..."; const e = d.querySelector(".det"); e.innerHTML = det || ""; e.classList.toggle("bad", st === false); }
let frame = null;
function start() {
  $("bRun").disabled = true; $("checks").innerHTML = ""; $("rooms").innerHTML = ""; $("sumHead").textContent = "Running"; $("sumText").textContent = "Loading the game in the background.";
  for (const [id, title, text] of CHECKS) row($("checks"), "c-" + id, title, text);
  if (frame) frame.remove();
  frame = document.createElement("iframe"); frame.src = "./index.html?" + (TEST ? "secretstest&" : "") + "secretcheck=" + Date.now(); document.body.appendChild(frame);
  const t0 = Date.now(), wait = setInterval(() => {
    let tc = null; try { tc = frame.contentWindow.__tc; } catch (e) {}
    if (tc && tc.secretAudit && tc.names) { clearInterval(wait); setTimeout(() => run(tc), 50); }
    else if (Date.now() - t0 > 90000) { clearInterval(wait); for (const [id] of CHECKS) set($("c-" + id), false, "The game did not start within 90 seconds."); $("sumHead").textContent = "Could not run"; $("sumText").textContent = "The game did not load."; $("bRun").disabled = false; }
  }, 250);
}
const MOUNT = { corner: "high corner", overExit: "over the exit", overEntry: "over the way in", pole: "drop pole", pillar: "pillar", window: "window sill", lowDoor: "low over the door", pipe: "pipe", watch: "watching", kept: "kept" };
const WALL = { x0: "start wall", x1: "exit wall", z0: "near wall", z1: "far wall", ceil: "ceiling", pillar: "pillar", floor: "floor" };
function run(tc) {
  let a; try { a = tc.secretAudit(); } catch (e) { for (const [id] of CHECKS) set($("c-" + id), false, esc(e)); $("bRun").disabled = false; return; }
  const all = a.rows.flatMap(r => r.bad.map(b => "[" + (r.i + 1) + "] " + r.name + ": " + b)), G = {}; for (const g of a.global) G[g.id] = g;
  let fails = 0;
  for (const [id, , , re] of CHECKS) {
    if (typeof re === "string") { const g = G[re]; if (!g) { set($("c-" + id), true, TEST ? "Not checked for a single room." : ""); continue; } if (!g.ok) fails++; set($("c-" + id), g.ok, esc(g.text)); continue; }
    const bad = all.filter(b => re.test(b.replace(/^\[\d+\] [^:]+: /, "")));
    if (bad.length) fails++;
    set($("c-" + id), !bad.length, bad.length ? bad.slice(0, 12).map(esc).join("<br>") + (bad.length > 12 ? "<br>and " + (bad.length - 12) + " more" : "") : "");
  }
  let badRooms = 0, oldRooms = 0, secrets = 0;
  for (const r of a.rows) {
    const tags = [];
    for (const c of r.cams) tags.push('<span class="tag cam">' + esc((c.watch ? "watching" : MOUNT[c.mount] || c.mount) + ", " + (WALL[c.wall] || c.wall)) + "</span>");
    if (!r.cams.length) tags.push('<span class="tag none">no camera</span>');
    for (const s of r.secrets) { secrets++; tags.push('<span class="tag sec">' + esc(s.what + (s.way ? " · " + s.way : "")) + "</span>"); }
    if (r.legacy) tags.push('<span class="tag old">' + r.legacy + " old den" + (r.legacy > 1 ? "s" : "") + ", rebuilt in I-3 and I-4</span>");
    for (const n of r.notes || []) tags.push('<span class="tag old">' + esc(n) + "</span>");
    if (r.nothing) tags.push('<span class="tag none">a room with nothing</span>');
    const st = r.bad.length ? false : r.legacy ? "old" : true; if (st === false) badRooms++; if (st === "old") oldRooms++;
    const d = row($("rooms"), "r-" + r.i, "Chamber " + r.ch + " Room " + r.part + " [" + (r.i + 1) + "] <small>" + esc(r.name) + "</small>", tags.join(""));
    set(d, st, r.bad.map(esc).join("<br>"));
  }
  $("sumHead").textContent = fails ? fails + " of " + CHECKS.length + " checks failed" : "All " + CHECKS.length + " checks pass";
  $("sumText").textContent = "Game " + a.version + ". " + a.rows.length + " room" + (a.rows.length > 1 ? "s" : "") + ", " + a.rows.reduce((n, r) => n + r.cams.length, 0) + " cameras, " + secrets + " new secrets, " + badRooms + " with a problem" + (oldRooms ? ", " + oldRooms + " still have old dens" : "") + ".";
  $("bRun").disabled = false; window.__secretcheck = { fails, badRooms, audit: a };
  frame.remove(); frame = null;
}
$("bRun").addEventListener("click", start);
// hover hints
const tip = $("tip");
document.addEventListener("pointerover", e => { const b = e.target.closest("[data-tip]"); if (!b) { tip.hidden = true; return; } tip.textContent = b.dataset.tip; tip.hidden = false; const r = b.getBoundingClientRect(); tip.style.left = Math.max(8, Math.min(innerWidth - 270, r.left)) + "px"; tip.style.top = (r.bottom + 8) + "px"; });
document.addEventListener("pointerout", e => { if (e.target.closest("[data-tip]")) tip.hidden = true; });
start();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(function(){});</script>
</body></html>
